<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드로잉엣홈 카드뉴스 생성기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#151515; color:#fff; font-family:'Pretendard','Apple SD Gothic Neo',sans-serif; min-height:100vh; padding:30px 16px 60px; display:flex; flex-direction:column; align-items:center; }
h1 { font-size:13px; letter-spacing:5px; color:#666; margin-bottom:6px; text-transform:uppercase; font-weight:400; }
.subtitle { font-size:12px; color:#444; margin-bottom:32px; letter-spacing:1px; }
.global-settings { width:100%; max-width:900px; background:#1e1e1e; border:1px solid #2a2a2a; border-radius:8px; padding:24px; margin-bottom:24px; display:flex; gap:24px; flex-wrap:wrap; align-items:flex-end; }
.g-group { display:flex; flex-direction:column; gap:8px; }
.g-group label { font-size:10px; letter-spacing:2px; color:#666; text-transform:uppercase; }
.cat-btns { display:flex; gap:6px; flex-wrap:wrap; }
.cat-btn { padding:6px 12px; border:1px solid #333; background:transparent; color:#888; font-size:11px; letter-spacing:1px; cursor:pointer; border-radius:2px; transition:all 0.2s; font-family:inherit; }
.cat-btn:hover,.cat-btn.active { border-color:#fff; color:#fff; background:#2a2a2a; }
.pos-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; width:110px; }
.pos-btn { padding:6px; border:1px solid #2a2a2a; background:transparent; color:#555; font-size:16px; cursor:pointer; border-radius:2px; transition:all 0.2s; text-align:center; font-family:inherit; }
.pos-btn:hover,.pos-btn.active { border-color:#fff; color:#fff; background:#2a2a2a; }
.slider-row { display:flex; align-items:center; gap:10px; }
.slider-row input[type=range] { width:110px; accent-color:#fff; }
.slider-row span { font-size:12px; color:#666; width:36px; }
.upload-zone { width:100%; max-width:900px; border:2px dashed #2a2a2a; border-radius:8px; padding:32px; text-align:center; cursor:pointer; transition:border-color 0.2s; margin-bottom:28px; }
.upload-zone:hover { border-color:#555; }
.upload-zone p { color:#555; font-size:14px; line-height:2; }
.upload-zone p span { color:#444; font-size:12px; }
.upload-zone input { display:none; }
.cards-grid { width:100%; max-width:900px; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; margin-bottom:32px; }
.card-item { background:#1e1e1e; border:1px solid #2a2a2a; border-radius:8px; overflow:hidden; position:relative; transition:box-shadow 0.2s; cursor:grab; }
.card-item:active { cursor:grabbing; }
.card-item.dragging { opacity:0.4; box-shadow:0 0 0 2px #555; }
.card-item.drag-over { box-shadow:0 0 0 2px #fff; }
.card-item.cover-card { border-color:#555; cursor:default; }
.card-badge { position:absolute; top:8px; left:10px; z-index:3; font-size:10px; letter-spacing:1px; padding:3px 8px; border-radius:2px; font-family:inherit; }
.badge-cover { background:rgba(255,255,255,0.12); color:#ccc; border:1px solid rgba(255,255,255,0.25); }
.badge-num { background:rgba(0,0,0,0.5); color:#aaa; }
.card-preview { width:100%; aspect-ratio:1; display:block; background:#111; }
.card-controls { padding:14px; display:flex; flex-direction:column; gap:10px; }
.layout-tabs { display:flex; gap:6px; }
.layout-tab { flex:1; padding:7px 4px; border:1px solid #2a2a2a; background:transparent; color:#666; font-size:11px; cursor:pointer; border-radius:2px; transition:all 0.2s; text-align:center; font-family:inherit; }
.layout-tab:hover,.layout-tab.active { border-color:#fff; color:#fff; background:#2a2a2a; }
.ctrl-label { font-size:10px; color:#555; letter-spacing:1px; margin-bottom:-4px; }
.card-controls textarea,.card-controls input[type=text] { width:100%; background:#151515; border:1px solid #2a2a2a; border-radius:3px; color:#fff; font-size:13px; padding:10px; font-family:inherit; resize:none; outline:none; transition:border-color 0.2s; line-height:1.5; }
.card-controls textarea:focus,.card-controls input[type=text]:focus { border-color:#555; }
.card-controls textarea::placeholder,.card-controls input[type=text]::placeholder { color:#444; }
.list-items { display:flex; flex-direction:column; gap:6px; }
.list-item-row { display:flex; gap:6px; align-items:center; }
.list-item-row input { flex:1; }
.remove-item-btn { width:28px; height:28px; background:transparent; border:1px solid #2a2a2a; color:#555; border-radius:2px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
.remove-item-btn:hover { border-color:#c00; color:#c00; }
.add-item-btn { width:100%; padding:7px; background:transparent; border:1px dashed #2a2a2a; color:#555; font-size:12px; cursor:pointer; border-radius:2px; font-family:inherit; transition:all 0.2s; }
.add-item-btn:hover { border-color:#666; color:#aaa; }
.card-row { display:flex; gap:8px; align-items:center; }
.card-cat-select { flex:1; background:#151515; border:1px solid #2a2a2a; border-radius:3px; color:#aaa; font-size:12px; padding:7px 10px; font-family:inherit; outline:none; cursor:pointer; }
.delete-btn { width:32px; height:32px; border:1px solid #2a2a2a; background:transparent; color:#555; border-radius:3px; cursor:pointer; font-size:15px; transition:all 0.2s; display:flex; align-items:center; justify-content:center; }
.delete-btn:hover { border-color:#c00; color:#c00; }
.btn-replace { padding:0 12px; height:32px; background:transparent; border:1px solid #2a2a2a; color:#888; border-radius:3px; cursor:pointer; font-size:11px; font-family:inherit; transition:all 0.2s; white-space:nowrap; }
.btn-replace:hover { border-color:#fff; color:#fff; }
/* 이미지 저장 오버레이 */
#saveOverlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.94);
  z-index:9999; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  padding:20px;
}
#saveOverlay.show { display:flex; }
.bottom-bar { width:100%; max-width:900px; display:flex; gap:12px; flex-wrap:wrap; }
.btn-primary { flex:1; padding:16px; background:#fff; color:#111; border:none; border-radius:4px; font-size:13px; letter-spacing:2px; cursor:pointer; font-family:inherit; font-weight:700; transition:background 0.2s; text-transform:uppercase; min-width:180px; }
.btn-primary:hover { background:#ddd; }
.btn-secondary { padding:16px 24px; background:transparent; color:#888; border:1px solid #333; border-radius:4px; font-size:12px; letter-spacing:1px; cursor:pointer; font-family:inherit; transition:all 0.2s; white-space:nowrap; }
.btn-secondary:hover { border-color:#888; color:#fff; }
.empty-state { grid-column:1/-1; text-align:center; padding:40px; color:#333; font-size:14px; }
.cover-label { font-size:10px; color:#555; letter-spacing:2px; text-align:center; padding:4px 0 2px; text-transform:uppercase; }
canvas { display:none; }
</style>
</head>
<body>
<!-- 이미지 저장 오버레이 (iOS용) -->
<div id="saveOverlay">
  <div id="overlayCounter" style="color:#666;font-size:12px;letter-spacing:2px;"></div>
  <img id="overlayImg" src="" alt="저장할 이미지" style="max-width:92vw;max-height:62vh;object-fit:contain;border-radius:4px;">
  <p style="color:#aaa;font-size:14px;text-align:center;line-height:2;letter-spacing:0.5px;">
    이미지를 <strong style="color:#fff">길게 눌러</strong> 사진에 저장하세요
  </p>
  <div style="display:flex;gap:12px;">
    <button id="overlayNextBtn" style="display:none;padding:12px 24px;background:#333;color:#fff;border:1px solid #555;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;" onclick="overlayNext()">다음 카드 →</button>
    <button style="padding:12px 32px;background:#fff;color:#111;border:none;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;" onclick="closeSaveOverlay()">완료</button>
  </div>
</div>
<h1>Drawing at Home</h1>
<p class="subtitle">카드뉴스 생성기</p>
<div class="global-settings">
  <div class="g-group">
    <label>기본 카테고리</label>
    <div class="cat-btns" id="globalCatBtns">
      <button class="cat-btn active" onclick="setGlobalCat(this,'공간정보')">PLACE</button>
      <button class="cat-btn" onclick="setGlobalCat(this,'스타일링팁')">STYLING TIP</button>
      <button class="cat-btn" onclick="setGlobalCat(this,'시공사례')">PORTFOLIO</button>
      <button class="cat-btn" onclick="setGlobalCat(this,'PICK')">PICK</button>
      <button class="cat-btn" onclick="setGlobalCat(this,'')">없음</button>
    </div>
  </div>
  <div class="g-group">
    <label>텍스트 위치</label>
    <div class="pos-grid" id="globalPosBtns">
      <button class="pos-btn" onclick="setGlobalPos(this,'top-left')">↖</button>
      <button class="pos-btn" onclick="setGlobalPos(this,'top-center')">↑</button>
      <button class="pos-btn" onclick="setGlobalPos(this,'top-right')">↗</button>
      <button class="pos-btn active" onclick="setGlobalPos(this,'bottom-left')">↙</button>
      <button class="pos-btn" onclick="setGlobalPos(this,'bottom-center')">↓</button>
      <button class="pos-btn" onclick="setGlobalPos(this,'bottom-right')">↘</button>
    </div>
  </div>
  <div class="g-group">
    <label>글씨 크기</label>
    <div class="slider-row">
      <input type="range" id="globalFontSize" min="20" max="60" value="36" oninput="onGlobalChange()">
      <span id="fontSizeVal">36</span>
    </div>
  </div>
  <div class="g-group">
    <label>사진 어둡기</label>
    <div class="slider-row">
      <input type="range" id="globalDim" min="0" max="80" value="40" oninput="onGlobalChange()">
      <span id="dimVal">40%</span>
    </div>
  </div>
  <div class="g-group">
    <label>로고 크기</label>
    <div class="slider-row">
      <input type="range" id="logoScale" min="10" max="60" value="28" oninput="onGlobalChange()">
      <span id="logoScaleVal">28%</span>
    </div>
  </div>
</div>
<div class="upload-zone" onclick="document.getElementById('photoInput').click()">
  <p>📷 클릭해서 사진 업로드 (여러 장 한번에 선택 가능)<br>
  <span>첫 번째 사진이 표지가 됩니다 — JPG, PNG 최대 20장</span></p>
  <input type="file" id="photoInput" accept="image/*" multiple>
</div>
<div class="cards-grid" id="cardsGrid">
  <div class="empty-state">사진을 업로드하면 여기에 카드가 생성돼요</div>
</div>
<div class="bottom-bar">
  <button class="btn-primary" onclick="downloadAll()">전체 저장 (JPG)</button>
  <button class="btn-secondary" onclick="downloadCurrent()">현재 카드 저장</button>
  <button class="btn-secondary" onclick="document.getElementById('photoInput').click()">+ 사진 추가</button>
</div>
<p style="text-align:center;font-size:11px;color:#444;margin-top:8px;letter-spacing:1px;">
  1080×1080px · JPG · 인스타그램 최적화
</p>

let cards=[], globalCat='공간정보', globalPos='bottom-left';

function setGlobalCat(btn,cat){
  document.querySelectorAll('#globalCatBtns .cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); globalCat=cat;
  cards.forEach((c,i)=>{if(i>0){c.category=cat;renderCardPreview(i);}});
  document.querySelectorAll('.card-cat-select').forEach((s,i)=>{if(i>0)s.value=cat;});
}
function setGlobalPos(btn,pos){
  document.querySelectorAll('#globalPosBtns .pos-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); globalPos=pos;
  cards.forEach((c,i)=>{if(i>0){c.position=pos;renderCardPreview(i);}});
}
function onGlobalChange(){
  document.getElementById('fontSizeVal').textContent=document.getElementById('globalFontSize').value;
  document.getElementById('dimVal').textContent=document.getElementById('globalDim').value+'%';
  document.getElementById('logoScaleVal').textContent=document.getElementById('logoScale').value+'%';
  cards.forEach((_,i)=>renderCardPreview(i));
}

document.getElementById('photoInput').addEventListener('change',function(e){
  const files=Array.from(e.target.files); if(!files.length)return;
  let loaded=0;
  files.forEach((file,fi)=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        cards.push({img,title:'',subtitle:'',description:'',
          category:globalCat,position:globalPos,
          layout:cards.length+fi===0?'cover':'basic',listItems:['','','']});
        if(++loaded===files.length) renderGrid();
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  this.value='';
});

function catSelectHTML(cat,idx){
  return ['공간정보','스타일링팁','시공사례','PICK',''].map(v=>
    `<option value="${v}" ${v===cat?'selected':''}>${CAT_EN[v]||'카테고리 없음'}</option>`
  ).join('');
}

function renderGrid(){
  const grid=document.getElementById('cardsGrid');
  grid.innerHTML='';
  if(!cards.length){grid.innerHTML='<div class="empty-state">사진을 업로드하면 여기에 카드가 생성돼요</div>';return;}
  cards.forEach((card,i)=>{
    const isCover=(i===0);
    const item=document.createElement('div');
    item.className='card-item'+(isCover?' cover-card':'');
    item.dataset.index=i;
    if(!isCover) setupDrag(item,i);
    item.innerHTML=buildCardHTML(card,i,isCover);
    grid.appendChild(item);
    renderCardPreview(i);
  });
}

function buildCardHTML(card,i,isCover){
  const badge=isCover
    ?'<span class="card-badge badge-cover">표지</span>'
    :`<span class="card-badge badge-num">${i} / ${cards.length-1}</span>`;
  if(isCover){
    return `${badge}
      <canvas class="card-preview" id="preview_0" width="1080" height="1080"></canvas>
      <div class="card-controls">
        <p class="cover-label">— 표지 카드 —</p>
        <textarea rows="2" placeholder="메인 제목" oninput="cards[0].title=this.value;renderCardPreview(0)">${card.title}</textarea>
        <input type="text" placeholder="서브타이틀 (선택사항)" oninput="cards[0].subtitle=this.value;renderCardPreview(0)" value="${card.subtitle||''}">
        <div class="card-row">
          <button class="btn-replace" onclick="document.getElementById('replaceInput_0').click()">📷 사진 교체</button>
          <button class="delete-btn" onclick="deleteCover()" title="표지 삭제">✕</button>
          <input type="file" id="replaceInput_0" accept="image/*" style="display:none" onchange="replacePhoto(0,this)">
        </div>
      </div>`;
  }
  const tabs=['basic','list','magazine'].map(l=>{
    const labels={basic:'기본형',list:'리스트형',magazine:'매거진형'};
    return `<button class="layout-tab ${card.layout===l?'active':''}" onclick="setLayout(${i},'${l}')">${labels[l]}</button>`;
  }).join('');
  let content='';
  if(card.layout==='list'){
    const rows=card.listItems.map((it,li)=>`
      <div class="list-item-row">
        <input type="text" placeholder="항목 ${li+1}" value="${it}" oninput="onListItem(${i},${li},this.value)">
        ${card.listItems.length>1?`<button class="remove-item-btn" onclick="removeListItem(${i},${li})">−</button>`:''}
      </div>`).join('');
    content=`<div class="list-items">${rows}</div>
      ${card.listItems.length<4?`<button class="add-item-btn" onclick="addListItem(${i})">+ 항목 추가</button>`:''}`;
  } else if(card.layout==='magazine'){
    // 매거진형: 설명 텍스트만
    content=`
      <p class="ctrl-label">본문 텍스트</p>
      <textarea rows="4" placeholder="본문 텍스트 (최대 3줄)" oninput="onDesc(${i},this.value)">${card.description||''}</textarea>`;
  } else {
    content=`
      <p class="ctrl-label">제목</p>
      <textarea rows="2" placeholder="제목" oninput="onTitle(${i},this.value)">${card.title}</textarea>
      <p class="ctrl-label">설명 텍스트</p>
      <textarea rows="3" placeholder="본문 설명 (선택사항)" oninput="onDesc(${i},this.value)">${card.description||''}</textarea>`;
  }
  const catRow=`<div class="card-row">
    <button class="btn-replace" onclick="document.getElementById('replaceInput_${i}').click()">📷 교체</button>
    <input type="file" id="replaceInput_${i}" accept="image/*" style="display:none" onchange="replacePhoto(${i},this)">
    <select class="card-cat-select" onchange="onCat(${i},this.value)">${catSelectHTML(card.category,i)}</select>
    <button class="delete-btn" onclick="deleteCard(${i})">✕</button>
  </div>`;
  return `${badge}
    <canvas class="card-preview" id="preview_${i}" width="1080" height="1080"></canvas>
    <div class="card-controls"><div class="layout-tabs">${tabs}</div>${content}${catRow}</div>`;
}

function onTitle(i,v){cards[i].title=v;renderCardPreview(i);}
function onDesc(i,v){cards[i].description=v;renderCardPreview(i);}
function onCat(i,v){cards[i].category=v;renderCardPreview(i);}
function onListItem(i,li,v){cards[i].listItems[li]=v;renderCardPreview(i);}
function addListItem(i){cards[i].listItems.push('');rebuildCard(i);}
function removeListItem(i,li){cards[i].listItems.splice(li,1);rebuildCard(i);}
function setLayout(i,l){cards[i].layout=l;rebuildCard(i);}
function deleteCard(i){cards.splice(i,1);renderGrid();}

// 표지 삭제 → 다음 카드가 표지가 됨
function deleteCover(){
  if(cards.length<=1){alert('카드가 1장뿐이라 삭제할 수 없어요.');return;}
  cards.splice(0,1);
  cards[0].layout='cover'; // 새 표지로 전환
  renderGrid();
}

// 사진 교체
function replacePhoto(idx,input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      cards[idx].img=img;
      renderCardPreview(idx);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  input.value='';
}
function rebuildCard(i){const el=document.querySelector(`[data-index="${i}"]`);if(el){el.innerHTML=buildCardHTML(cards[i],i,i===0);renderCardPreview(i);}}

let dragSrc=null;
function setupDrag(item,i){
  item.draggable=true;
  item.addEventListener('dragstart',e=>{dragSrc=i;item.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
  item.addEventListener('dragend',()=>{item.classList.remove('dragging');document.querySelectorAll('.card-item').forEach(el=>el.classList.remove('drag-over'));});
  item.addEventListener('dragover',e=>{e.preventDefault();if(dragSrc!==null&&dragSrc!==i&&i!==0){document.querySelectorAll('.card-item').forEach(el=>el.classList.remove('drag-over'));item.classList.add('drag-over');}});
  item.addEventListener('drop',e=>{e.preventDefault();if(dragSrc===null||dragSrc===i||i===0)return;const moved=cards.splice(dragSrc,1)[0];cards.splice(i,0,moved);dragSrc=null;renderGrid();});
}

/* ── 공통 유틸 ── */
function getLogoSize(){const s=parseInt(document.getElementById('logoScale').value)/100;return{lw:logoImg.naturalWidth*s,lh:logoImg.naturalHeight*s};}
function drawLogo(t){if(!logoImg.complete||!logoImg.naturalWidth)return;const{lw,lh}=getLogoSize();t.globalAlpha=LOGO_ALPHA;t.drawImage(logoImg,(W-lw)/2,LOGO_Y,lw,lh);t.globalAlpha=1;}
function applyTopGrad(t){const g=t.createLinearGradient(0,0,0,H*0.32);g.addColorStop(0,'rgba(0,0,0,0.62)');g.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=g;t.fillRect(0,0,W,H);}
function applyBtmGrad(t){const g=t.createLinearGradient(0,H*0.44,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.85)');t.fillStyle=g;t.fillRect(0,0,W,H);}
function drawBg(t,card,dim){t.clearRect(0,0,W,H);const r=Math.max(W/card.img.width,H/card.img.height);const bw=card.img.width*r,bh=card.img.height*r;t.drawImage(card.img,(W-bw)/2,(H-bh)/2,bw,bh);t.fillStyle=`rgba(0,0,0,${dim})`;t.fillRect(0,0,W,H);}

// 어절 단위 줄바꿈 + 말줄임
function wrapWords(t,text,maxW,maxLines){
  if(!text)return[];
  const words=text.split(' ');let lines=[],cur='';
  for(let w of words){const test=cur?cur+' '+w:w;if(t.measureText(test).width>maxW&&cur!==''){lines.push(cur);cur=w;}else cur=test;}
  if(cur)lines.push(cur);
  if(maxLines&&lines.length>maxLines){
    lines=lines.slice(0,maxLines);
    let last=lines[maxLines-1];
    while(t.measureText(last+'…').width>maxW&&last.length>0)last=last.slice(0,-1);
    lines[maxLines-1]=last+'…';
  }
  return lines;
}
function wrapTitle(t,text,maxW){
  const manual=(text||'').split('\n');const result=[];
  for(const m of manual)result.push(...wrapWords(t,m,maxW,2));
  return result.slice(0,3);
}

// 번호+카테고리 한 줄
function drawNumCat(t,numStr,cat,x,y){
  t.save();t.textAlign='left';
  t.font=`200 ${NUM_FS}px 'Pretendard',sans-serif`;
  t.fillStyle=`rgba(255,253,250,${NUM_ALPHA})`;
  t.letterSpacing='1px';t.fillText(numStr,x,y);
  const numW=t.measureText(numStr).width;
  if(cat){
    t.font=`500 ${CAT_FS}px 'Pretendard',sans-serif`;
    t.fillStyle=`rgba(255,253,250,${CAT_ALPHA})`;
    t.letterSpacing='2px';
    t.fillText(catLabel(cat),x+numW+CAT_GAP,y-(NUM_FS-CAT_FS)*0.35);
  }
  t.restore();
}

// ⑪ 제목 텍스트 쉐도우 (제목에만)
function setTitleShadow(t){
  t.shadowColor='rgba(0,0,0,0.25)';
  t.shadowBlur=6;
  t.shadowOffsetX=0; t.shadowOffsetY=1;
}
function clearShadow(t){t.shadowColor='transparent';t.shadowBlur=0;}

/* ── 표지형 ── */
function drawCover(t,card,fs){
  const tG=t.createLinearGradient(0,0,0,H*0.32);tG.addColorStop(0,'rgba(0,0,0,0.55)');tG.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=tG;t.fillRect(0,0,W,H);
  const bG=t.createLinearGradient(0,H*0.50,0,H);bG.addColorStop(0,'rgba(0,0,0,0)');bG.addColorStop(1,'rgba(0,0,0,0.80)');t.fillStyle=bG;t.fillRect(0,0,W,H);
  drawLogo(t);
  const coverFS=Math.min(fs*1.1,108);
  const subFS=Math.round(coverFS*0.40);
  const titleLH=coverFS*1.28;
  t.save();t.font=`700 ${coverFS}px 'Pretendard',sans-serif`;
  const titleLines=wrapTitle(t,card.title,TITLE_MAX_W);t.restore();
  // ⑨ PAD*1.4
  const titleY=H-PAD*1.4-(titleLines.length-1)*titleLH;
  // ⑧ 간격 36px
  const subY=titleY-coverFS-36;
  if(card.subtitle){
    t.save();t.font=`400 ${subFS}px 'Pretendard',sans-serif`;
    t.fillStyle=`rgba(255,253,250,0.74)`; // ⑭ 0.80→0.74
    t.textAlign='left';t.letterSpacing='0px';
    t.fillText(wrapWords(t,card.subtitle,TITLE_MAX_W,1)[0]||'',PAD,subY);t.restore();
  }
  if(titleLines.length){
    t.save();setTitleShadow(t); // ⑪
    t.font=`700 ${coverFS}px 'Pretendard',sans-serif`;
    t.fillStyle=TITLE_COLOR; // ⑮
    t.textAlign='left';t.letterSpacing='0px';
    titleLines.forEach((l,i)=>t.fillText(l,PAD,titleY+i*titleLH));
    clearShadow(t);t.restore();
  }
}

/* ── 기본형 ── */
function drawBasic(t,card,fs,idx){
  applyTopGrad(t);applyBtmGrad(t);drawLogo(t);
  const titleFS=Math.min(fs*1.05,100);
  const titleLH=titleFS*1.25; // ② 1.30→1.25
  const desc=card.description||'';
  t.save();
  t.font=`700 ${titleFS}px 'Pretendard',sans-serif`;
  const titleLines=wrapTitle(t,card.title,TITLE_MAX_W);
  t.font=`400 ${DESC_FS}px 'Pretendard',sans-serif`;
  const dLines=wrapWords(t,desc,TITLE_MAX_W,2);t.restore();
  const descH=desc?dLines.length*DESC_LH+DESC_GAP:0;
  const blockH=NUM_FS+TITLE_GAP+titleLines.length*titleLH+descH;
  const maxTop=desc?H*0.68:H*0.62;
  const blockTop=Math.min(H-PAD*1.4-blockH,maxTop);
  const numY=blockTop+NUM_FS;
  const titleY=numY+TITLE_GAP+titleFS;
  drawNumCat(t,String(idx).padStart(2,'0'),card.category,PAD,numY);
  t.save();setTitleShadow(t); // ⑪
  t.font=`700 ${titleFS}px 'Pretendard',sans-serif`;
  t.fillStyle=TITLE_COLOR;t.textAlign='left';t.letterSpacing='0px';
  titleLines.forEach((l,i)=>t.fillText(l,PAD,titleY+i*titleLH));
  clearShadow(t);t.restore();
  if(desc&&dLines.length){
    t.save();t.font=`400 ${DESC_FS}px 'Pretendard',sans-serif`;
    t.fillStyle=`rgba(255,253,250,${DESC_ALPHA})`; // ⑤
    t.textAlign='left';t.letterSpacing='0px';
    const dY=titleY+(titleLines.length-1)*titleLH+DESC_GAP+DESC_FS;
    dLines.forEach((l,i)=>t.fillText(l,PAD,dY+i*DESC_LH));t.restore();
  }
}

/* ── 리스트형 ── */
function drawList(t,card,fs,idx){
  const g=t.createLinearGradient(0,H*0.32,0,H);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.75)');
  t.fillStyle=g;t.fillRect(0,0,W,H);
  applyTopGrad(t);drawLogo(t);
  const items=card.listItems.slice(0,4).filter(s=>s&&s.trim());
  const itemFS=Math.min(fs*0.52,50);
  const itemLH=itemFS*1.52;
  const numCatH=NUM_FS+20;
  const totalH=numCatH+items.length*itemLH;
  // ⑩ PAD*1.6
  const blockTop=H-PAD*1.6-totalH;
  const numY=blockTop+NUM_FS;
  drawNumCat(t,String(idx).padStart(2,'0'),card.category,PAD,numY);
  const itemStartY=numY+20+itemFS;
  items.forEach((item,i)=>{
    const y=itemStartY+i*itemLH;
    if(y>H-PAD)return;
    t.beginPath();t.arc(PAD+DOT_R,y-itemFS*0.32,DOT_R,0,Math.PI*2);
    t.fillStyle=`rgba(255,253,250,${DOT_ALPHA})`;t.fill(); // ⑬
    t.save();t.font=`400 ${itemFS}px 'Pretendard',sans-serif`;
    t.fillStyle=`rgba(255,253,250,${ITEM_ALPHA})`; // ⑥
    t.textAlign='left';t.letterSpacing='0px';
    const maxW=W-PAD*2-DOT_R*2-14;
    const line=wrapWords(t,item,maxW,1)[0]||item;
    t.fillText(line,PAD+DOT_R*2+14,y);t.restore();
  });
}

/* ── 매거진형 — 제목 없음, 설명 텍스트 중심 ── */
function drawMagazine(t,card,fs,idx){
  t.fillStyle='#1a1a1c';t.fillRect(0,0,W,H);
  drawLogo(t);
  const frameX=PAD,frameY=MAG_FRAME_Y,frameW=W-PAD*2,frameH=H*0.50;
  t.save();t.beginPath();t.rect(frameX,frameY,frameW,frameH);t.clip();
  const r=Math.max(frameW/card.img.width,frameH/card.img.height);
  const bw=card.img.width*r,bh=card.img.height*r;
  t.drawImage(card.img,frameX+(frameW-bw)/2,frameY+(frameH-bh)/2,bw,bh);
  t.restore();
  const frameBotY=frameY+frameH,remaining=H-frameBotY;
  const desc=card.description||'';
  t.save();t.font=`400 ${DESC_FS}px 'Pretendard',sans-serif`;
  const dLines=wrapWords(t,desc,TITLE_MAX_W,3); // 최대 3줄
  t.restore();
  const descH=desc?dLines.length*DESC_LH:0;
  const blockH=NUM_FS+24+descH;
  const blockTop=Math.max(frameBotY+32,frameBotY+(remaining-blockH)*0.70);
  const numY=blockTop+NUM_FS;
  // 번호+카테고리
  drawNumCat(t,String(idx).padStart(2,'0'),card.category,PAD,numY);
  // 설명 텍스트 (제목 없음, 더 크게)
  if(desc&&dLines.length){
    const MAG_DESC_FS=Math.min(fs*0.56,52); // 설명을 좀 더 크게
    t.save();t.font=`400 ${MAG_DESC_FS}px 'Pretendard',sans-serif`;
    const magDLines=wrapWords(t,desc,TITLE_MAX_W,3);
    const MAG_DESC_LH=MAG_DESC_FS*1.48;
    t.fillStyle=`rgba(255,253,250,0.88)`; // 설명이 메인이므로 더 밝게
    t.textAlign='left';t.letterSpacing='0px';
    const dY=numY+30+MAG_DESC_FS;
    magDLines.forEach((l,i)=>t.fillText(l,PAD,dY+i*MAG_DESC_LH));
    t.restore();
  }
}

function drawToCanvas(t,card,i){
  const fs=parseInt(document.getElementById('globalFontSize').value)*2.2;
  const dim=parseInt(document.getElementById('globalDim').value)/100;
  t.clearRect(0,0,W,H);
  if(i===0){drawBg(t,card,dim);drawCover(t,card,fs);}
  else if(card.layout==='list'){drawBg(t,card,dim);drawList(t,card,fs,i);}
  else if(card.layout==='magazine'){drawMagazine(t,card,fs,i);}
  else{drawBg(t,card,dim);drawBasic(t,card,fs,i);}
}
function renderCardPreview(i){const pc=document.getElementById(`preview_${i}`);if(!pc)return;drawToCanvas(pc.getContext('2d'),cards[i],i);}
// iOS 감지
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

// 공통 저장 함수 — iOS: 오버레이, PC/Android: 직접 다운로드
function saveCanvas(filename){
  const quality=0.92;
  const dataUrl=canvas.toDataURL('image/jpeg',quality);

  if(isIOS){
    // iOS: 오버레이에 이미지 표시 → 길게 눌러 저장
    const overlay=document.getElementById('saveOverlay');
    const img=document.getElementById('overlayImg');
    const label=document.getElementById('overlayLabel');
    img.src=dataUrl;
    if(label) label.textContent=filename;
    // 전체 저장 중이면 "다음 카드" 버튼 표시
    const nextBtn=document.getElementById('overlayNextBtn');
    if(nextBtn) nextBtn.style.display=window._iosNextCard?'block':'none';
    overlay.classList.add('show');
  } else {
    // PC / Android: 직접 다운로드
    const a=document.createElement('a');
    a.download=filename;
    a.href=dataUrl;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}

function closeSaveOverlay(){
  document.getElementById('saveOverlay').classList.remove('show');
  document.getElementById('overlayImg').src='';
  window._iosNextCard=null;
}
function overlayNext(){
  // 다음 카드 표시
  if(window._iosNextCard) window._iosNextCard();
}

// 현재 카드 저장
function downloadCurrent(){
  if(!cards.length){alert('사진을 먼저 업로드해주세요!');return;}
  // 현재 화면에 보이는 첫 번째 카드 저장
  const visibleCards=document.querySelectorAll('.card-item');
  let targetIdx=0;
  for(let el of visibleCards){
    const rect=el.getBoundingClientRect();
    if(rect.top>=0&&rect.top<window.innerHeight){
      targetIdx=parseInt(el.dataset.index)||0;
      break;
    }
  }
  targetIdx=Math.min(Math.max(0,targetIdx),cards.length-1); // 범위 보호
  drawToCanvas(ctx,cards[targetIdx],targetIdx);
  const label=targetIdx===0?'표지':cards[targetIdx].layout;
  saveCanvas(`DAH_${String(targetIdx).padStart(2,'0')}_${label}.jpg`);
}

// 전체 저장
async function downloadAll(){
  if(!cards.length){alert('사진을 먼저 업로드해주세요!');return;}
  // iOS: 순서 표시 후 한 장씩 오버레이로 저장
  if(isIOS){
    let idx=0;
    function showNext(){
      if(idx>=cards.length)return;
      drawToCanvas(ctx,cards[idx],idx);
      const label=idx===0?'표지':cards[idx].layout;
      const filename=`DAH_${String(idx).padStart(2,'0')}_${label}.jpg`;
      // 오버레이에 카드번호 안내 추가
      const counter=document.getElementById('overlayCounter');
      if(counter) counter.textContent=`${idx+1} / ${cards.length}`;
      saveCanvas(filename);
      idx++;
    }
    // 오버레이 닫을 때 다음 카드 자동 표시
    window._iosNextCard=showNext;
    showNext();
    return;
  }
  for(let i=0;i<cards.length;i++){
    drawToCanvas(ctx,cards[i],i);
    const label=i===0?'표지':cards[i].layout;
    saveCanvas(`DAH_${String(i).padStart(2,'0')}_${label}.jpg`);
    await new Promise(r=>setTimeout(r,400));
  }
}
</script>
</body>
