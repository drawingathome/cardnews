<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DAH 카드뉴스">
<meta name="theme-color" content="#faf9f7">
<title>드로잉엣홈 카드뉴스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root {
  --bg: #faf9f7; --bg2: #ffffff; --border: #e8e4df; --border2: #d4cfc9;
  --text: #1a1614; --text2: #6b6560; --text3: #a8a29d;
  --accent: #8b6f5c; --accent-light: #f0ebe4; --accent-hover: #6d5548;
  --danger: #c0392b;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --radius: 10px; --radius-sm: 6px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:'Pretendard','Apple SD Gothic Neo',sans-serif; min-height:100vh; padding:24px 16px 80px; display:flex; flex-direction:column; align-items:center; }
.app-header { width:100%; max-width:960px; display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid var(--border); }
.app-logo { display:flex; flex-direction:column; gap:2px; }
.app-logo-title { font-size:11px; letter-spacing:4px; color:var(--text2); font-weight:400; text-transform:uppercase; }
.app-logo-sub { font-size:10px; color:var(--text3); letter-spacing:1px; }
.app-badge { font-size:10px; letter-spacing:2px; color:var(--text3); background:var(--accent-light); padding:4px 10px; border-radius:20px; font-weight:500; }
.global-settings { width:100%; max-width:960px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; display:flex; gap:20px; flex-wrap:wrap; align-items:flex-end; box-shadow:var(--shadow); }
.g-group { display:flex; flex-direction:column; gap:8px; }
.g-group label { font-size:10px; letter-spacing:2px; color:var(--text3); text-transform:uppercase; font-weight:500; }
.cat-btns { display:flex; gap:6px; flex-wrap:wrap; }
.cat-btn { padding:6px 14px; border:1px solid var(--border2); background:var(--bg); color:var(--text2); font-size:11px; letter-spacing:1px; cursor:pointer; border-radius:20px; transition:all 0.18s; font-family:inherit; font-weight:500; }
.cat-btn:hover { border-color:var(--accent); color:var(--accent); }
.cat-btn.active { border-color:var(--accent); color:var(--bg2); background:var(--accent); }
.pos-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; width:108px; }
.pos-btn { padding:7px; border:1px solid var(--border); background:var(--bg); color:var(--text3); font-size:15px; cursor:pointer; border-radius:var(--radius-sm); transition:all 0.18s; text-align:center; font-family:inherit; }
.pos-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-light); }
.pos-btn.active { border-color:var(--accent); color:var(--bg2); background:var(--accent); }
.slider-row { display:flex; align-items:center; gap:10px; }
.slider-row input[type=range] { width:110px; accent-color:var(--accent); }
.slider-row span { font-size:12px; color:var(--text2); width:36px; font-weight:500; }
.upload-zone { width:100%; max-width:960px; border:2px dashed var(--border2); border-radius:var(--radius); padding:36px 24px; text-align:center; cursor:pointer; transition:all 0.2s; margin-bottom:20px; background:var(--bg2); }
.upload-zone:hover { border-color:var(--accent); background:var(--accent-light); }
.upload-zone p { color:var(--text2); font-size:14px; line-height:2.2; }
.upload-zone p span { color:var(--text3); font-size:12px; }
.upload-zone input { display:none; }
.cards-grid { width:100%; max-width:960px; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; margin-bottom:28px; }
.card-item { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; position:relative; transition:all 0.2s; cursor:grab; box-shadow:var(--shadow); }
.card-item:hover { box-shadow:var(--shadow-md); }
.card-item:active { cursor:grabbing; }
.card-item.dragging { opacity:0.4; box-shadow:0 0 0 2px var(--text3); }
.card-item.drag-over { box-shadow:0 0 0 2px var(--accent); }
.card-item.cover-card { border-color:var(--accent); }
.card-item.closing-card { border-color:var(--border); opacity:0.9; }
.card-badge { position:absolute; top:8px; left:10px; z-index:3; font-size:10px; letter-spacing:1px; padding:3px 8px; border-radius:4px; font-family:inherit; font-weight:600; }
.badge-cover { background:rgba(139,111,92,0.9); color:#fff; }
.badge-num { background:rgba(0,0,0,0.4); color:rgba(255,255,255,0.9); }
.card-preview { width:100%; aspect-ratio:1080/1350; display:block; background:var(--bg); }
.card-controls { padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--bg2); }
.layout-tabs { display:flex; gap:4px; background:var(--bg); border-radius:var(--radius-sm); padding:3px; }
.layout-tab { flex:1; padding:7px 4px; border:none; background:transparent; color:var(--text3); font-size:10px; cursor:pointer; border-radius:4px; transition:all 0.18s; text-align:center; font-family:inherit; font-weight:500; }
.layout-tab:hover { color:var(--text); }
.layout-tab.active { background:var(--bg2); color:var(--text); box-shadow:var(--shadow); font-weight:600; }
.ctrl-label { font-size:10px; color:var(--text3); letter-spacing:1px; margin-bottom:-4px; text-transform:uppercase; }
.card-controls textarea,.card-controls input[type=text] { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-size:13px; padding:10px 12px; font-family:inherit; resize:none; outline:none; transition:border-color 0.2s; line-height:1.6; }
.card-controls textarea:focus,.card-controls input[type=text]:focus { border-color:var(--accent); }
.card-controls textarea::placeholder,.card-controls input[type=text]::placeholder { color:var(--text3); }
.list-items { display:flex; flex-direction:column; gap:6px; }
.list-item-row { display:flex; gap:6px; align-items:center; }
.list-item-row input { flex:1; }
.remove-item-btn { width:30px; height:30px; background:transparent; border:1px solid var(--border); color:var(--text3); border-radius:var(--radius-sm); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
.remove-item-btn:hover { border-color:var(--danger); color:var(--danger); }
.add-item-btn { width:100%; padding:8px; background:transparent; border:1px dashed var(--border2); color:var(--text3); font-size:12px; cursor:pointer; border-radius:var(--radius-sm); font-family:inherit; transition:all 0.2s; }
.add-item-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-light); }
.card-row { display:flex; gap:8px; align-items:center; }
.card-cat-select { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text2); font-size:12px; padding:7px 10px; font-family:inherit; outline:none; cursor:pointer; }
.delete-btn { width:32px; height:32px; border:1px solid var(--border); background:transparent; color:var(--text3); border-radius:var(--radius-sm); cursor:pointer; font-size:15px; transition:all 0.2s; display:flex; align-items:center; justify-content:center; }
.delete-btn:hover { border-color:var(--danger); color:var(--danger); background:#fff0ee; }
.btn-replace { padding:0 14px; height:32px; background:transparent; border:1px solid var(--border2); color:var(--text2); border-radius:var(--radius-sm); cursor:pointer; font-size:11px; font-family:inherit; transition:all 0.2s; white-space:nowrap; }
.btn-replace:hover { border-color:var(--accent); color:var(--accent); }
#saveOverlay { display:none; position:fixed; inset:0; background:rgba(15,12,10,0.96); z-index:9999; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:20px; }
#saveOverlay.show { display:flex; }
.btn-primary { flex:1; padding:16px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius); font-size:13px; letter-spacing:2px; cursor:pointer; font-family:inherit; font-weight:700; transition:background 0.2s; text-transform:uppercase; min-width:160px; box-shadow:0 4px 12px rgba(139,111,92,0.3); }
.btn-primary:hover { background:var(--accent-hover); }
.btn-secondary { padding:16px 20px; background:var(--bg2); color:var(--text2); border:1px solid var(--border2); border-radius:var(--radius); font-size:12px; letter-spacing:1px; cursor:pointer; font-family:inherit; transition:all 0.2s; white-space:nowrap; font-weight:500; }
.btn-secondary:hover { border-color:var(--accent); color:var(--accent); }
.empty-state { grid-column:1/-1; text-align:center; padding:48px 20px; color:var(--text3); font-size:14px; line-height:2; }
.cover-label { font-size:10px; color:var(--text3); letter-spacing:2px; text-align:center; padding:6px 0 2px; text-transform:uppercase; }
#saveNotice { background:#f0faf5; border:1px solid #b7e4c7; color:#2d6a4f; }
canvas { display:none; }
</style>
<script>
const _manifest={name:'드로잉엣홈 카드뉴스',short_name:'DAH 카드뉴스',start_url:'/',display:'standalone',background_color:'#faf9f7',theme_color:'#8b6f5c',icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%238b6f5c' rx='40'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle' fill='white' font-family='serif'%3ED%3C/text%3E%3C/svg%3E",sizes:'192x192',type:'image/svg+xml'}]};
const _mb=new Blob([JSON.stringify(_manifest)],{type:'application/json'});
const _ml=document.createElement('link');_ml.rel='manifest';_ml.href=URL.createObjectURL(_mb);document.head.appendChild(_ml);
</script>
</head>
<body>
 
<div id="saveOverlay">
  <div id="overlayCounter" style="color:#666;font-size:12px;letter-spacing:2px;"></div>
  <img id="overlayImg" src="" alt="저장할 이미지" style="max-width:92vw;max-height:62vh;object-fit:contain;border-radius:4px;">
  <p style="color:#aaa;font-size:14px;text-align:center;line-height:2;letter-spacing:0.5px;">이미지를 <strong style="color:#fff">손가락으로 꾹 누르고</strong> → <strong style="color:#fff">'사진에 저장'</strong> 선택</p>
  <div style="display:flex;gap:12px;">
    <button id="overlayNextBtn" style="display:none;padding:12px 24px;background:#333;color:#fff;border:1px solid #555;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;" onclick="overlayNext()">다음 카드 →</button>
    <button style="padding:12px 32px;background:#fff;color:#111;border:none;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;" onclick="closeSaveOverlay()">완료</button>
  </div>
</div>
 
<div class="app-header">
  <div class="app-logo">
    <span class="app-logo-title">Drawing at Home</span>
    <span class="app-logo-sub">카드뉴스 생성기</span>
  </div>
  <span class="app-badge">v24</span>
</div>
 
<div class="global-settings">
  <div class="g-group">
    <label>기본 카테고리</label>
    <div class="cat-btns" id="globalCatBtns">
      <button class="cat-btn active" onclick="setGlobalCat(this,'공간정보')">PLACE</button>
      <button class="cat-btn" onclick="setGlobalCat(this,'스타일링팁')">STYLING TIP</button>
      <button class="cat-btn" onclick="setGlobalCat(this,'시공사례')">PORTFOLIO</button>
      <button class="cat-btn" onclick="setGlobalCat(this,'PICK')">PICK</button>
      <button class="cat-btn" onclick="setGlobalCat(this,'')">없음</button>
    </div>
  </div>
  <div class="g-group">
    <label>텍스트 위치</label>
    <div class="pos-grid" id="globalPosBtns">
      <button class="pos-btn" onclick="setGlobalPos(this,'top-left')">↖</button>
      <button class="pos-btn" onclick="setGlobalPos(this,'top-center')">↑</button>
      <button class="pos-btn" onclick="setGlobalPos(this,'top-right')">↗</button>
      <button class="pos-btn active" onclick="setGlobalPos(this,'bottom-left')">↙</button>
      <button class="pos-btn" onclick="setGlobalPos(this,'bottom-center')">↓</button>
      <button class="pos-btn" onclick="setGlobalPos(this,'bottom-right')">↘</button>
    </div>
  </div>
  <div class="g-group">
    <label>글씨 크기</label>
    <div class="slider-row">
      <input type="range" id="globalFontSize" min="20" max="60" value="36" oninput="onGlobalChange()">
      <span id="fontSizeVal">36</span>
    </div>
  </div>
  <div class="g-group">
    <label>사진 어둡기</label>
    <div class="slider-row">
      <input type="range" id="globalDim" min="0" max="60" value="10" oninput="onGlobalChange()">
      <span id="dimVal">10%</span>
    </div>
  </div>
  <div class="g-group">
    <label>로고 크기</label>
    <div class="slider-row">
      <input type="range" id="logoScale" min="10" max="60" value="36" oninput="onGlobalChange()">
      <span id="logoScaleVal">36</span>
    </div>
  </div>
</div>
 
<div id="saveNotice" style="display:none;border-radius:8px;padding:10px 16px;font-size:12px;letter-spacing:1px;margin-bottom:12px;width:100%;max-width:960px;text-align:center;">✓ 이전 작업 내용을 불러왔어요</div>
<div class="upload-zone" onclick="document.getElementById('photoInput').click()">
  <p>📷 클릭해서 사진 업로드 (여러 장 한번에 선택 가능)<br>
  <span>첫 번째 사진이 표지가 됩니다 — JPG, PNG 최대 20장</span></p>
  <input type="file" id="photoInput" accept="image/*" multiple>
</div>
<div class="cards-grid" id="cardsGrid">
  <div class="empty-state">사진을 업로드하면 여기에 카드가 생성돼요</div>
</div>
<div style="width:100%;max-width:960px;display:flex;flex-direction:column;gap:8px;margin-top:8px;">
  <button class="btn-primary" onclick="downloadAll()" style="width:100%;padding:18px;font-size:14px;letter-spacing:3px;">전체 저장</button>
  <div style="display:flex;gap:8px;">
    <button class="btn-secondary" onclick="downloadCurrent()" style="flex:1;padding:13px 8px;font-size:12px;text-align:center;">현재 카드 저장</button>
    <button class="btn-secondary" onclick="document.getElementById('photoInput').click()" style="flex:1;padding:13px 8px;font-size:12px;text-align:center;">+ 사진 추가</button>
  </div>
  <p style="text-align:center;font-size:11px;color:var(--text3);letter-spacing:1px;">1080×1350px · JPG · 인스타그램 최적화</p>
</div>
<canvas id="offscreen" width="1080" height="1350"></canvas>
 
<script>
const W=1080,H=1350,PAD=80;
const NUM_FS=52,NUM_ALPHA=0.75,CAT_FS=30,CAT_GAP=14,CAT_ALPHA=0.70;
const DESC_FS=44,DESC_LH=DESC_FS*1.55,DESC_ALPHA=0.88;
const LOGO_Y=PAD*0.85,LOGO_ALPHA=0.95;
const TITLE_GAP=32,DESC_GAP=32,TITLE_MAX_W=W-PAD*2;
const DOT_R=6,DOT_ALPHA=0.70,ITEM_ALPHA=0.92;
const TITLE_COLOR='rgba(255,253,250,1)';
const CAT_EN={'공간정보':'PLACE','스타일링팁':'STYLING TIP','시공사례':'PORTFOLIO','PICK':'PICK','':''};
const catLabel=c=>CAT_EN[c]||c;
const canvas=document.getElementById('offscreen');
const ctx=canvas.getContext('2d');
 
// ✅ 로고 — base64 대신 파일 참조 (파일 크기 대폭 축소)
const logoImg=new Image();
logoImg.src='https://raw.githubusercontent.com/drawingathome/cardnews/main/logo.png';
 
let whiteLogoCanvas=null;
function buildWhiteLogo(){
  if(!logoImg.complete||!logoImg.naturalWidth)return;
  const w=logoImg.naturalWidth,h=logoImg.naturalHeight;
  whiteLogoCanvas=document.createElement('canvas');
  whiteLogoCanvas.width=w;whiteLogoCanvas.height=h;
  const c=whiteLogoCanvas.getContext('2d');
  c.drawImage(logoImg,0,0);
  const imgData=c.getImageData(0,0,w,h);
  const d=imgData.data;
  for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];}
  c.putImageData(imgData,0,0);
}
logoImg.onload=buildWhiteLogo;
if(logoImg.complete&&logoImg.naturalWidth)buildWhiteLogo();
 
function getLogoSize(){
  const s=parseInt(document.getElementById('logoScale').value)/100;
  return{lw:logoImg.naturalWidth*s,lh:logoImg.naturalHeight*s};
}
function drawLogo(t){
  const src=whiteLogoCanvas||null;
  if(!src)return;
  const{lw,lh}=getLogoSize();
  t.save();t.globalCompositeOperation='screen';t.globalAlpha=LOGO_ALPHA;
  t.drawImage(src,(W-lw)/2,LOGO_Y,lw,lh);t.restore();
}
 
let cards=[],globalCat='공간정보',globalPos='bottom-left';
 
function setGlobalCat(btn,cat){
  document.querySelectorAll('#globalCatBtns .cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');globalCat=cat;
  cards.forEach((c,i)=>{if(i>0){c.category=cat;renderCardPreview(i);}});
  document.querySelectorAll('.card-cat-select').forEach((s,i)=>{if(i>0)s.value=cat;});
}
function setGlobalPos(btn,pos){
  document.querySelectorAll('#globalPosBtns .pos-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');globalPos=pos;
  cards.forEach((c,i)=>{if(i>0){c.position=pos;renderCardPreview(i);}});
}
function onGlobalChange(){
  document.getElementById('fontSizeVal').textContent=document.getElementById('globalFontSize').value;
  document.getElementById('dimVal').textContent=document.getElementById('globalDim').value+'%';
  document.getElementById('logoScaleVal').textContent=document.getElementById('logoScale').value;
  cards.forEach((_,i)=>renderCardPreview(i));
  const cc=document.getElementById('preview_closing');
  if(cc)drawClosing(cc.getContext('2d'));
}
 
document.getElementById('photoInput').addEventListener('change',async function(e){
  const files=Array.from(e.target.files);if(!files.length)return;
  // 순서 보장: 파일을 순차적으로 처리
  for(let fi=0;fi<files.length;fi++){
    const file=files[fi];
    await new Promise(resolve=>{
      const reader=new FileReader();
      reader.onload=ev=>{
        const img=new Image();
        img.onload=()=>{
          cards.push({img,title:'',subtitle:'',description:'',introStat:'',
            category:globalCat,position:globalPos,
            layout:cards.length===1&&fi===0?'cover':'basic',listItems:['','','']});
          resolve();
        };
        img.src=ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  renderGrid();
  restoreTexts();
  this.value='';
});
 
function catSelectHTML(cat){
  return ['공간정보','스타일링팁','시공사례','PICK',''].map(v=>
    `<option value="${v}" ${v===cat?'selected':''}>${CAT_EN[v]||'카테고리 없음'}</option>`
  ).join('');
}
 
function renderGrid(){
  const grid=document.getElementById('cardsGrid');
  grid.innerHTML='';
  if(!cards.length){grid.innerHTML='<div class="empty-state">사진을 업로드하면 여기에 카드가 생성돼요</div>';return;}
  cards.forEach((card,i)=>{
    const isCover=(i===0);
    const item=document.createElement('div');
    item.className='card-item'+(isCover?' cover-card':'');
    item.dataset.index=i;
    if(!isCover)setupDrag(item,i);
    item.innerHTML=buildCardHTML(card,i,isCover);
    grid.appendChild(item);
    renderCardPreview(i);
  });
  const closingItem=document.createElement('div');
  closingItem.className='card-item closing-card';
  closingItem.dataset.index='closing';
  closingItem.innerHTML=`
    <span class="card-badge badge-cover" style="background:rgba(255,255,255,0.08);">마감</span>
    <canvas class="card-preview" id="preview_closing" width="1080" height="1350"></canvas>
    <div class="card-controls">
      <p class="cover-label" style="color:#555;">— 마감 카드 (고정) —</p>
      <div class="card-row" style="margin-top:4px;">
        <button class="btn-replace" onclick="document.getElementById('closingPhotoInput').click()">📷 마감 전용 사진</button>
        <button class="btn-replace" onclick="clearClosingPhoto()" style="color:#c00;">× 마감 사진 제거</button>
        <input type="file" id="closingPhotoInput" accept="image/*" style="display:none" onchange="setClosingPhoto(this)">
      </div>
      <p style="font-size:11px;color:var(--text3);text-align:center;padding:2px 0;">미설정 시 그라디언트 배경으로 표시</p>
    </div>`;
  grid.appendChild(closingItem);
  const cc=document.getElementById('preview_closing');
  if(cc)drawClosing(cc.getContext('2d'));
}
 
function buildCardHTML(card,i,isCover){
  const badge=isCover
    ?'<span class="card-badge badge-cover">표지</span>'
    :`<span class="card-badge badge-num">${i} / ${cards.length-1}</span>`;
  if(isCover){
    return `${badge}
      <canvas class="card-preview" id="preview_0" width="1080" height="1350"></canvas>
      <div class="card-controls">
        <p class="cover-label">— 표지 카드 —</p>
        <textarea rows="2" placeholder="메인 제목" oninput="cards[0].title=this.value;renderCardPreview(0);autoSave()">${card.title}</textarea>
        <input type="text" placeholder="서브타이틀 (제목 아래 표시)" oninput="cards[0].subtitle=this.value;renderCardPreview(0);autoSave()" value="${card.subtitle||''}">

          <input type="file" id="replaceInput_0" accept="image/*" style="display:none" onchange="replacePhoto(0,this)">
        </div>
      </div>`;
  }
  // ✅ 인트로형 추가
  const tabs=['basic','intro','list','magazine'].map(l=>{
    const labels={basic:'기본형',intro:'인트로형',list:'리스트형',magazine:'매거진형'};
    return `<button class="layout-tab ${card.layout===l?'active':''}" onclick="setLayout(${i},'${l}')">${labels[l]}</button>`;
  }).join('');
  let content='';
  if(card.layout==='intro'){
    content=`<p class="ctrl-label">임팩트 문구 (크게)</p><textarea rows="2" placeholder='예: 이 공간, 커튼 하나가 바꿨습니다' oninput="onIntroStat(${i},this.value)">${card.introStat||''}</textarea><p class="ctrl-label">부제 (작게, 선택)</p><textarea rows="2" placeholder='예: → 다음 장에서 확인하세요' oninput="onDesc(${i},this.value)">${card.description||''}</textarea>`;
  } else if(card.layout==='list'){
    const rows=card.listItems.map((it,li)=>`<div class="list-item-row"><input type="text" placeholder="항목 ${li+1}" value="${it}" oninput="onListItem(${i},${li},this.value)">${card.listItems.length>1?`<button class="remove-item-btn" onclick="removeListItem(${i},${li})">−</button>`:''}</div>`).join('');
    content=`<div class="list-items">${rows}</div>${card.listItems.length<4?`<button class="add-item-btn" onclick="addListItem(${i})">+ 항목 추가</button>`:''}`;
  } else if(card.layout==='magazine'){
    content=`<p class="ctrl-label">본문 텍스트</p><textarea rows="4" placeholder="본문 텍스트 (최대 3줄)" oninput="onDesc(${i},this.value)">${card.description||''}</textarea>`;
  } else {
    content=`<p class="ctrl-label">제목</p><textarea rows="2" placeholder="제목" oninput="onTitle(${i},this.value)">${card.title}</textarea><p class="ctrl-label">설명 텍스트</p><textarea rows="3" placeholder="본문 설명 (선택사항)" oninput="onDesc(${i},this.value)">${card.description||''}</textarea>`;
  }
  const catRow=`<div class="card-row">
    <button class="btn-replace" onclick="document.getElementById('replaceInput_${i}').click()">📷 교체</button>
    <input type="file" id="replaceInput_${i}" accept="image/*" style="display:none" onchange="replacePhoto(${i},this)">
    <select class="card-cat-select" onchange="onCat(${i},this.value)">${catSelectHTML(card.category)}</select>
    <button class="delete-btn" onclick="deleteCard(${i})">✕</button>
  </div>`;
  return `${badge}
    <canvas class="card-preview" id="preview_${i}" width="1080" height="1350"></canvas>
    <div class="card-controls"><div class="layout-tabs">${tabs}</div>${content}${catRow}</div>`;
}
 
function onTitle(i,v){cards[i].title=v;renderCardPreview(i);autoSave();}
function onDesc(i,v){cards[i].description=v;renderCardPreview(i);autoSave();}
function onCat(i,v){cards[i].category=v;renderCardPreview(i);autoSave();}
function onListItem(i,li,v){cards[i].listItems[li]=v;renderCardPreview(i);autoSave();}
function onIntroStat(i,v){cards[i].introStat=v;renderCardPreview(i);autoSave();}
function addListItem(i){cards[i].listItems.push('');rebuildCard(i);autoSave();}
function removeListItem(i,li){cards[i].listItems.splice(li,1);rebuildCard(i);autoSave();}
function setLayout(i,l){cards[i].layout=l;rebuildCard(i);autoSave();}
function deleteCard(i){cards.splice(i,1);renderGrid();autoSave();}
 
function autoSave(){
  try{
    localStorage.setItem('dah_settings',JSON.stringify({
      fontSize:document.getElementById('globalFontSize').value,
      dim:document.getElementById('globalDim').value,
      logoScale:document.getElementById('logoScale').value,
      globalCat,globalPos
    }));
    const texts=cards.map(c=>({
      title:c.title||'',subtitle:c.subtitle||'',
      description:c.description||'',
      introStat:c.introStat||'',
      listItems:c.listItems||['','',''],
      category:c.category||'',
      position:c.position||'bottom-left',
      layout:c.layout||'basic'
    }));
    localStorage.setItem('dah_texts',JSON.stringify(texts));
  }catch(e){}
}
function loadSavedSettings(){
  try{
    const s=JSON.parse(localStorage.getItem('dah_settings')||'{}');
    if(s.fontSize)document.getElementById('globalFontSize').value=s.fontSize;
    if(s.dim)document.getElementById('globalDim').value=s.dim;
    if(s.logoScale)document.getElementById('logoScale').value=s.logoScale;
    // globalCat, globalPos UI 버튼 복원
    if(s.globalCat!==undefined){
      globalCat=s.globalCat;
      document.querySelectorAll('#globalCatBtns .cat-btn').forEach(b=>{
        b.classList.toggle('active', b.getAttribute('onclick').includes("'"+s.globalCat+"'"));
      });
    }
    if(s.globalPos){
      globalPos=s.globalPos;
      const posMap={'top-left':0,'top-center':1,'top-right':2,'bottom-left':3,'bottom-center':4,'bottom-right':5};
      document.querySelectorAll('#globalPosBtns .pos-btn').forEach((b,i)=>{
        b.classList.toggle('active', i===posMap[s.globalPos]);
      });
    }
    onGlobalChange();
  }catch(e){}
}
function restoreTexts(){
  try{
    const saved=JSON.parse(localStorage.getItem('dah_texts')||'[]');
    saved.forEach((s,i)=>{
      if(!cards[i])return;
      cards[i].title=s.title||'';
      cards[i].subtitle=s.subtitle||'';
      cards[i].description=s.description||'';
      cards[i].introStat=s.introStat||'';
      cards[i].listItems=s.listItems||['','',''];
      cards[i].category=s.category||globalCat;
      cards[i].position=s.position||globalPos;
      cards[i].layout=s.layout||'basic';
    });
    if(saved.length&&saved.length===cards.length){
      renderGrid();
      const n=document.getElementById('saveNotice');
      if(n){n.style.display='block';setTimeout(()=>n.style.display='none',3000);}
    }
  }catch(e){}
}
loadSavedSettings();

  cards.splice(0,1);cards[0].layout='cover';renderGrid();

function setupDrag(item,i){
  item.draggable=true;
  item.addEventListener('dragstart',e=>{dragSrc=i;item.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
  item.addEventListener('dragend',()=>{item.classList.remove('dragging');document.querySelectorAll('.card-item').forEach(el=>el.classList.remove('drag-over'));});
  item.addEventListener('dragover',e=>{e.preventDefault();if(dragSrc!==null&&dragSrc!==i&&i!==0){document.querySelectorAll('.card-item').forEach(el=>el.classList.remove('drag-over'));item.classList.add('drag-over');}});
  item.addEventListener('drop',e=>{e.preventDefault();if(dragSrc===null||dragSrc===i||i===0)return;const moved=cards.splice(dragSrc,1)[0];cards.splice(i,0,moved);dragSrc=null;renderGrid();});

function applyTopGrad(t){const g=t.createLinearGradient(0,0,0,H*0.30);g.addColorStop(0,'rgba(0,0,0,0.22)');g.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=g;t.fillRect(0,0,W,H);}
function applyBtmGrad(t){const g=t.createLinearGradient(0,H*0.50,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.22)');t.fillStyle=g;t.fillRect(0,0,W,H);}
function drawBg(t,card,dim){
  t.clearRect(0,0,W,H);
  const r=Math.max(W/card.img.width,H/card.img.height);
  const bw=card.img.width*r,bh=card.img.height*r;
  t.drawImage(card.img,(W-bw)/2,(H-bh)/2,bw,bh);
  t.fillStyle=`rgba(0,0,0,${dim})`;t.fillRect(0,0,W,H);
}
function wrapWords(t,text,maxW,maxLines){
  if(!text)return[];
  function fitWord(w){
    if(t.measureText(w).width<=maxW)return[w];
    const parts=[];let chunk='';
    for(const ch of w){
      if(t.measureText(chunk+ch).width>maxW){if(chunk)parts.push(chunk);chunk=ch;}
      else chunk+=ch;
    }
    if(chunk)parts.push(chunk);
    return parts;
  }
  const words=text.split(' ');let lines=[],cur='';
  for(const w of words){
    const fitted=fitWord(w);
    for(const fw of fitted){
      const test=cur?cur+' '+fw:fw;
      if(t.measureText(test).width>maxW&&cur!==''){lines.push(cur);cur=fw;}
      else cur=test;
    }
  }
  if(cur)lines.push(cur);
  if(maxLines&&lines.length>maxLines){
    lines=lines.slice(0,maxLines);
    let last=lines[maxLines-1];
    while(t.measureText(last+'…').width>maxW&&last.length>0)last=last.slice(0,-1);
    lines[maxLines-1]=last+'…';
  }
  return lines;
}
function wrapTitle(t,text,maxW){
  const manual=(text||'').split('\n');const result=[];
  for(const m of manual)result.push(...wrapWords(t,m,maxW,2));
  return result.slice(0,3);
}
function drawNumCat(t,numStr,cat,x,y){
  if(!cat)return; // 없음 선택 시 숫자+카테고리 모두 숨김
  t.save();t.textAlign='left';
  t.font=`200 ${NUM_FS}px 'Pretendard',sans-serif`;
  t.fillStyle=`rgba(255,253,250,${NUM_ALPHA})`;
  t.letterSpacing='1px';t.fillText(numStr,x,y);
  const numW=t.measureText(numStr).width;
  if(cat){
    t.font=`500 ${CAT_FS}px 'Pretendard',sans-serif`;
    t.fillStyle=`rgba(255,253,250,${CAT_ALPHA})`;
    t.letterSpacing='1px';
    t.fillText(catLabel(cat),x+numW+CAT_GAP,y-Math.round((NUM_FS-CAT_FS)*0.38));
  }
  t.restore();
}
function setTitleShadow(t){t.shadowColor='rgba(0,0,0,0.25)';t.shadowBlur=6;t.shadowOffsetX=0;t.shadowOffsetY=1;}
function clearShadow(t){t.shadowColor='transparent';t.shadowBlur=0;}
 
function drawCover(t,card,fs){
  const tG=t.createLinearGradient(0,0,0,H*0.32);tG.addColorStop(0,'rgba(0,0,0,0.60)');tG.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=tG;t.fillRect(0,0,W,H);
  const bG=t.createLinearGradient(0,H*0.52,0,H);bG.addColorStop(0,'rgba(0,0,0,0)');bG.addColorStop(1,'rgba(0,0,0,0.22)');t.fillStyle=bG;t.fillRect(0,0,W,H);
  drawLogo(t);
  const coverFS=Math.min(fs*1.1,88);
  const subFS=Math.round(coverFS*0.44);
  const titleLH=coverFS*1.28;
  const hasSubtitle=card.subtitle&&card.subtitle.trim().length>0;
  t.save();t.font=`700 ${coverFS}px 'Pretendard',sans-serif`;
  const titleLines=wrapTitle(t,card.title,TITLE_MAX_W);t.restore();
  const blockBottom=H-PAD*1.15;
  const subBlockH=hasSubtitle?subFS+88:0;
  const titleY=blockBottom-subBlockH-(titleLines.length>1?(titleLines.length-1)*titleLH:0);
  if(titleLines.length){
    t.save();setTitleShadow(t);
    t.font=`700 ${coverFS}px 'Pretendard',sans-serif`;
    t.fillStyle=TITLE_COLOR;t.textAlign='left';t.letterSpacing='0px';
    titleLines.forEach((l,i)=>t.fillText(l,PAD,titleY+i*titleLH));
    clearShadow(t);t.restore();
  }
  if(hasSubtitle){
    t.save();t.font=`400 ${subFS}px 'Pretendard',sans-serif`;
    t.fillStyle=`rgba(255,253,250,0.80)`;t.textAlign='left';t.letterSpacing='0px';
    t.fillText(wrapWords(t,card.subtitle,TITLE_MAX_W,1)[0]||'',PAD,blockBottom);
    t.restore();
  }
}
 
function getPosConfig(pos){
  const isTop=pos&&pos.startsWith('top');
  const isCenter=pos&&pos.endsWith('center');
  const isRight=pos&&pos.endsWith('right');
  return{isTop,x:isCenter?W/2:(isRight?W-PAD:PAD),align:isCenter?'center':(isRight?'right':'left')};
}
 
function drawBasic(t,card,fs,idx){
  applyTopGrad(t);applyBtmGrad(t);drawLogo(t);
  const{isTop,x,align}=getPosConfig(card.position||'bottom-left');
  const titleFS=Math.min(fs*1.05,100);
  const titleLH=titleFS*1.25;
  const desc=card.description||'';
  t.save();t.font=`700 ${titleFS}px 'Pretendard',sans-serif`;
  const titleLines=wrapTitle(t,card.title,TITLE_MAX_W);
  t.font=`400 ${DESC_FS}px 'Pretendard',sans-serif`;
  const dLines=wrapWords(t,desc,TITLE_MAX_W,2);t.restore();
  const descH=desc?dLines.length*DESC_LH+DESC_GAP:0;
  const blockH=NUM_FS+TITLE_GAP+titleLines.length*titleLH+descH;
  const blockTop=isTop?LOGO_Y+90:Math.min(H-PAD*1.4-blockH,desc?H*0.68:H*0.62);
  const numY=blockTop+NUM_FS;
  const titleY=numY+TITLE_GAP+titleFS;
  drawNumCat(t,String(idx).padStart(2,'0'),card.category,PAD,numY);
  t.save();setTitleShadow(t);
  t.font=`700 ${titleFS}px 'Pretendard',sans-serif`;
  t.fillStyle=TITLE_COLOR;t.textAlign=align;t.letterSpacing='0px';
  titleLines.forEach((l,i)=>t.fillText(l,x,titleY+i*titleLH));
  clearShadow(t);t.restore();
  if(desc&&dLines.length){
    t.save();t.font=`400 ${DESC_FS}px 'Pretendard',sans-serif`;
    t.fillStyle=`rgba(255,253,250,${DESC_ALPHA})`;t.textAlign=align;t.letterSpacing='0px';
    const dY=titleY+(titleLines.length-1)*titleLH+DESC_GAP+DESC_FS;
    dLines.forEach((l,i)=>t.fillText(l,x,dY+i*DESC_LH));t.restore();
  }
}
 
function drawList(t,card,fs,idx){
  const g=t.createLinearGradient(0,H*0.32,0,H);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.72)');
  t.fillStyle=g;t.fillRect(0,0,W,H);
  applyTopGrad(t);drawLogo(t);
  const{isTop}=getPosConfig(card.position||'bottom-left');
  const items=card.listItems.slice(0,4).filter(s=>s&&s.trim());
  const itemFS=Math.min(fs*0.52,50);
  const itemLH=itemFS*1.52;
  const blockH=NUM_FS+28+items.length*itemLH;
  const blockTop=isTop?LOGO_Y+90:H-PAD*1.6-blockH;
  const numY=blockTop+NUM_FS;
  drawNumCat(t,String(idx).padStart(2,'0'),card.category,PAD,numY);
  const itemStartY=numY+28+itemFS;
  items.forEach((item,i)=>{
    const y=itemStartY+i*itemLH;
    if(y>H-PAD)return;
    t.beginPath();t.arc(PAD+DOT_R,y-itemFS*0.32,DOT_R,0,Math.PI*2);
    t.fillStyle=`rgba(255,253,250,${DOT_ALPHA})`;t.fill();
    t.save();t.font=`400 ${itemFS}px 'Pretendard',sans-serif`;
    t.fillStyle=`rgba(255,253,250,${ITEM_ALPHA})`;
    t.textAlign='left';t.letterSpacing='0px';
    const maxW=W-PAD*2-DOT_R*2-14;
    const line=wrapWords(t,item,maxW,1)[0]||item;
    t.fillText(line,PAD+DOT_R*2+14,y);t.restore();
  });
}
 
function drawMagazine(t,card,fs,idx){
  applyTopGrad(t);applyBtmGrad(t);drawLogo(t);
  const{isTop,x,align}=getPosConfig(card.position||'bottom-left');
  const desc=card.description||'';
  const MAG_FS=Math.min(fs*0.62,56);
  const MAG_LH=MAG_FS*1.58;
  t.save();t.font=`400 ${MAG_FS}px 'Pretendard',sans-serif`;
  const dLines=wrapWords(t,desc,TITLE_MAX_W,3);t.restore();
  const descH=dLines.length*MAG_LH;
  const blockH=NUM_FS+TITLE_GAP+descH;
  const blockTop=isTop?LOGO_Y+90:Math.min(H-PAD*1.4-blockH,H*0.62);
  const numY=blockTop+NUM_FS;
  drawNumCat(t,String(idx).padStart(2,'0'),card.category,PAD,numY);
  if(desc&&dLines.length){
    t.save();t.font=`400 ${MAG_FS}px 'Pretendard',sans-serif`;
    t.fillStyle=`rgba(255,253,250,0.92)`;t.textAlign=align;t.letterSpacing='0px';
    const dY=numY+TITLE_GAP+MAG_FS;
    dLines.forEach((l,i)=>t.fillText(l,x,dY+i*MAG_LH));t.restore();
  }
}
 
// ✅ 인트로형 — 궁금증 유발, 강한 임팩트 문구
function drawIntro(t,card,fs,idx){
  const g=t.createLinearGradient(0,H*0.30,0,H);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.6,'rgba(0,0,0,0.62)');g.addColorStop(1,'rgba(0,0,0,0.84)');
  t.fillStyle=g;t.fillRect(0,0,W,H);
  applyTopGrad(t);drawLogo(t);
  const introFS=Math.min(fs*1.25,108);
  const introLH=introFS*1.22;
  const subFS=Math.min(fs*0.55,50);
  const subLH=subFS*1.55;
  const mainText=card.introStat||card.title||'';
  const subText=card.description||'';
  t.save();
  t.font=`800 ${introFS}px 'Pretendard',sans-serif`;
  const mainLines=wrapTitle(t,mainText,TITLE_MAX_W);
  t.font=`300 ${subFS}px 'Pretendard',sans-serif`;
  const subLines=wrapWords(t,subText,TITLE_MAX_W,2);
  t.restore();
  const subH=subText?(subLines.length*subLH+40):0;
  const mainH=mainLines.length*introLH;
  const blockBottom=H-PAD*1.4;
  const numY=blockBottom-subH-mainH-28+NUM_FS*0.5;
  drawNumCat(t,String(idx).padStart(2,'0'),card.category,PAD,numY);
  const mainY=numY+28+introFS;
  t.save();setTitleShadow(t);
  t.font=`800 ${introFS}px 'Pretendard',sans-serif`;
  t.fillStyle=TITLE_COLOR;t.textAlign='left';t.letterSpacing='-1px';
  mainLines.forEach((l,i)=>t.fillText(l,PAD,mainY+i*introLH));
  clearShadow(t);t.restore();
  if(subText&&subLines.length){
    t.save();t.font=`300 ${subFS}px 'Pretendard',sans-serif`;
    t.fillStyle='rgba(255,253,250,0.78)';t.textAlign='left';t.letterSpacing='0px';
    const subY=mainY+mainLines.length*introLH+40;
    subLines.forEach((l,i)=>t.fillText(l,PAD,subY+i*subLH));t.restore();
  }
}
 
function drawClosing(t){
  t.clearRect(0,0,W,H);
  const bg=t.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#ffffff');bg.addColorStop(0.55,'#faf7f2');bg.addColorStop(1,'#f3ede3');
  t.fillStyle=bg;t.fillRect(0,0,W,H);
  if(closingImg){
    const r=Math.max(W/closingImg.width,H/closingImg.height);
    const bw=closingImg.width*r,bh=closingImg.height*r;
    t.save();t.globalCompositeOperation='multiply';t.globalAlpha=0.15;
    t.drawImage(closingImg,(W-bw)/2,(H-bh)/2,bw,bh);t.restore();
    const veil=t.createLinearGradient(0,0,0,H);
    veil.addColorStop(0,'rgba(255,255,255,0.70)');veil.addColorStop(1,'rgba(255,255,255,0.50)');
    t.fillStyle=veil;t.fillRect(0,0,W,H);
  }
  if(logoImg.complete&&logoImg.naturalWidth){
    const{lw,lh}=getLogoSize();
    t.save();t.globalCompositeOperation='multiply';t.globalAlpha=0.62;
    t.drawImage(logoImg,(W-lw)/2,LOGO_Y,lw,lh);t.restore();
  }
  const D82='rgba(24,18,12,0.82)';
  const D72='rgba(24,18,12,0.72)';
  const D52='rgba(24,18,12,0.52)';
  const D18='rgba(24,18,12,0.18)';
  let y=453;
  y+=78;
  t.save();t.font=`700 78px 'Pretendard',sans-serif`;
  t.fillStyle=D82;t.textAlign='center';t.letterSpacing='-2px';
  t.fillText('당신의 취향이',W/2,y);y+=78*1.28;t.fillText('머무는 곳,',W/2,y);t.restore();
  y+=72;
  t.save();t.font=`300 15px 'Pretendard',sans-serif`;
  t.fillStyle=D52;t.textAlign='center';t.letterSpacing='6px';
  t.fillText('DRAWING AT HOME',W/2,y);t.restore();
  y+=42;
  t.save();t.font=`300 20px 'Pretendard',sans-serif`;
  t.fillStyle=D72;t.textAlign='center';t.letterSpacing='0px';
  t.fillText('서울 서초구 반포동 725-21 1층',W/2,y);t.restore();
  y+=80;
  t.save();t.font=`300 14px 'Pretendard',sans-serif`;
  t.fillStyle=D52;t.textAlign='center';t.letterSpacing='5px';
  t.fillText('INSTAGRAM',W/2,y);y+=42;
  t.font=`500 32px 'Pretendard',sans-serif`;
  t.fillStyle='rgba(24,18,12,0.76)';t.letterSpacing='0px';
  t.fillText('@drawingathome_curtain',W/2,y);t.restore();
  t.save();t.font=`300 12px 'Pretendard',sans-serif`;
  t.fillStyle=D18;t.textAlign='center';t.letterSpacing='5px';
  t.fillText('EST. 2012',W/2,H-PAD);t.restore();
}
 
function drawToCanvas(t,card,i){
  const fs=parseInt(document.getElementById('globalFontSize').value)*2.2;
  const dim=parseInt(document.getElementById('globalDim').value)/100;
  t.clearRect(0,0,W,H);
  if(i===0){drawBg(t,card,dim);drawCover(t,card,fs);}
  else if(card.layout==='intro'){drawBg(t,card,dim);drawIntro(t,card,fs,i);}
  else if(card.layout==='list'){drawBg(t,card,dim);drawList(t,card,fs,i);}
  else if(card.layout==='magazine'){drawBg(t,card,dim);drawMagazine(t,card,fs,i);}
  else{drawBg(t,card,dim);drawBasic(t,card,fs,i);}
}
function renderCardPreview(i){const pc=document.getElementById(`preview_${i}`);if(!pc)return;drawToCanvas(pc.getContext('2d'),cards[i],i);}
 
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 
function saveCanvas(filename){
  const dataUrl=canvas.toDataURL('image/jpeg',0.92);
  if(isIOS){
    document.getElementById('overlayImg').src=dataUrl;
    const nextBtn=document.getElementById('overlayNextBtn');
    if(nextBtn)nextBtn.style.display=window._iosNextCard?'block':'none';
    document.getElementById('saveOverlay').classList.add('show');
  } else {
    canvas.toBlob(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.download=filename;a.href=url;
      document.body.appendChild(a);a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    },'image/jpeg',0.92);
  }
}
function closeSaveOverlay(){
  document.getElementById('saveOverlay').classList.remove('show');
  document.getElementById('overlayImg').src='';
  window._iosNextCard=null;
}
function overlayNext(){if(window._iosNextCard)window._iosNextCard();}
 
function downloadCurrent(){
  if(!cards.length){alert('사진을 먼저 업로드해주세요!');return;}
  const visibleCards=document.querySelectorAll('.card-item');
  let targetIdx=0;
  let isClosing=false;
  for(let el of visibleCards){
    const rect=el.getBoundingClientRect();
    if(rect.top>=0&&rect.top<window.innerHeight){
      if(el.dataset.index==='closing'){isClosing=true;}
      else{targetIdx=parseInt(el.dataset.index)||0;}
      break;
    }
  }
  if(isClosing){
    drawClosing(ctx);
    saveCanvas('DAH_마감.jpg');
    return;
  }
  targetIdx=Math.min(Math.max(0,targetIdx),cards.length-1);
  drawToCanvas(ctx,cards[targetIdx],targetIdx);
  const lkr={'basic':'기본형','intro':'인트로형','list':'리스트형','magazine':'매거진형'};
  saveCanvas(`DAH_${String(targetIdx).padStart(2,'0')}_${targetIdx===0?'표지':lkr[cards[targetIdx].layout]||cards[targetIdx].layout}.jpg`);
}
 
async function downloadAll(){
  if(!cards.length){alert('사진을 먼저 업로드해주세요!');return;}
  const layoutKrMap={'basic':'기본형','intro':'인트로형','list':'리스트형','magazine':'매거진형'};
  if(isIOS){
    const allCards=[];
    for(let i=0;i<cards.length;i++){
      drawToCanvas(ctx,cards[i],i);
      allCards.push({url:canvas.toDataURL('image/jpeg',0.92),name:i===0?'표지':(layoutKrMap[cards[i].layout]||cards[i].layout)});
    }
    drawClosing(ctx);
    allCards.push({url:canvas.toDataURL('image/jpeg',0.92),name:'마감'});
    function showIOSCard(idx){
      const card=allCards[idx];
      const counter=document.getElementById('overlayCounter');
      if(counter)counter.textContent=`${idx+1} / ${allCards.length}장 — ${card.name}`;
      document.getElementById('overlayImg').src=card.url;
      const nextBtn=document.getElementById('overlayNextBtn');
      if(idx<allCards.length-1){
        nextBtn.style.display='block';
        window._iosNextCard=()=>showIOSCard(idx+1);
      } else {
        nextBtn.style.display='none';
        window._iosNextCard=null;
      }
      document.getElementById('saveOverlay').classList.add('show');
    }
    showIOSCard(0);
    return;
  }
  // PC: JSZip으로 전체 ZIP 다운로드
  const statusBtn = document.querySelector('.btn-primary');
  const originalText = statusBtn.textContent;
  statusBtn.textContent = '압축 중...';
  statusBtn.disabled = true;
 
  try {
    if(!window.JSZip){
      await new Promise((resolve,reject)=>{
        const script=document.createElement('script');
        script.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        script.onload=resolve;
        script.onerror=()=>reject(new Error('JSZip 로드 실패. 네트워크를 확인해주세요.'));
        document.head.appendChild(script);
      });
    }
 
    const zip = new JSZip();
    for(let i=0;i<cards.length;i++){
      drawToCanvas(ctx,cards[i],i);
      const name = i===0?'표지':(layoutKrMap[cards[i].layout]||cards[i].layout);
      const filename = `DAH_${String(i).padStart(2,'0')}_${name}.jpg`;
      const dataUrl = canvas.toDataURL('image/jpeg',0.92);
      const base64 = dataUrl.split(',')[1];
      zip.file(filename, base64, {base64:true});
      statusBtn.textContent = `압축 중... ${i+1}/${cards.length+1}장`;
      await new Promise(r=>setTimeout(r,50));
    }
    drawClosing(ctx);
    const closingData = canvas.toDataURL('image/jpeg',0.92).split(',')[1];
    zip.file(`DAH_${String(cards.length).padStart(2,'0')}_마감.jpg`, closingData, {base64:true});
 
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.download = 'DAH_카드뉴스.zip';
    a.href = url;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  } finally {
    statusBtn.textContent = originalText;
    statusBtn.disabled = false;
  }
}
</script>
