<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:#f5f3ef;color:#2d2420;min-height:100vh;overflow-x:hidden;}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px calc(90px + env(safe-area-inset-bottom,0px));}
 
/* 헤더 */
.app-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:14px;color:#2d2420;}
 
/* 설정 */
.settings{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid #e8e0da;}
.settings h3{font-size:12px;font-weight:600;color:#8b6f5c;margin-bottom:10px;letter-spacing:.05em;}
.cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.cat-btn{padding:5px 11px;border:1px solid #d4c8c0;border-radius:20px;background:#fff;font-size:11px;cursor:pointer;color:#5c4035;}
.cat-btn.on{background:#8b6f5c;color:#fff;border-color:#8b6f5c;}
.sl-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;color:#6b5a52;}
.sl-row label{width:60px;flex-shrink:0;}
.sl-row input[type=range]{flex:1;accent-color:#8b6f5c;}
.sl-row span{width:22px;text-align:right;font-weight:600;font-size:12px;}
 
/* 업로드 */
.upload-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:18px;border:2px dashed #8b6f5c;border-radius:10px;background:#fffaf7;
  cursor:pointer;margin-bottom:12px;font-size:15px;font-weight:600;color:#5c4035;}
.upload-btn:active{background:#fff5f0;}
.upload-hint{text-align:center;font-size:11px;color:#a89890;margin-bottom:10px;}
 
/* 그리드 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.card-item{background:#fff;border:1px solid #e8e0da;border-radius:8px;overflow:hidden;position:relative;-webkit-user-select:none;user-select:none;}
.card-item.cover{border-color:#8b6f5c;grid-column:1/-1;}
.card-item.closing{border-color:#c8bdb7;}
.card-item.dragging{opacity:.4;will-change:transform;}
.card-item.dragover{outline:2px solid #8b6f5c;}
 
/* 카드 미리보기 */
.preview{position:relative;width:100%;aspect-ratio:1080/1350;overflow:hidden;background:#e8e0da;cursor:pointer;}
.preview canvas{width:100%;height:100%;display:block;}
 
/* 뱃지 */
.badge{position:absolute;top:7px;left:7px;font-size:9px;padding:2px 7px;border-radius:10px;
  background:rgba(0,0,0,.40);color:#fff;font-weight:600;z-index:5;pointer-events:none;}
.badge.cover-badge{background:#8b6f5c;}
.badge
 
/* 컨트롤 */
.ctrl{padding:10px;}
.lbl{font-size:10px;color:#a89890;font-weight:500;margin:7px 0 3px;}
.lbl:first-child{margin-top:0;}
.cover-lbl{font-size:10px;color:#a89890;text-align:center;margin-bottom:6px;}
.inp{width:100%;padding:7px 9px;border:1px solid #e8e0da;border-radius:6px;font-size:12px;background:#faf8f6;resize:vertical;outline:none;font-family:inherit;}
.inp:focus{border-color:#8b6f5c;}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab{padding:4px 8px;border:1px solid #d4c8c0;border-radius:5px;background:#fff;font-size:10px;cursor:pointer;color:#5c4035;white-space:nowrap;flex-shrink:0;}
.tab.on{background:#8b6f5c;color:#fff;border-color:#8b6f5c;}
.row{display:flex;gap:5px;align-items:center;margin-top:7px;flex-wrap:wrap;}
.btn{padding:6px 11px;border:1px solid #d4c8c0;border-radius:6px;background:#fff;font-size:11px;cursor:pointer;white-space:nowrap;}
.btn-del{border-color:#e8b4b4;color:#c44;}
.cat-sel{flex:1;padding:5px 4px;border:1px solid #e8e0da;border-radius:6px;font-size:10px;background:#fff;min-width:0;max-width:110px;}
 
/* 저장 바 */
.save-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-top:1px solid #e8e0da;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;gap:8px;justify-content:center;}
.save-btn{padding:11px 28px;background:#2d2420;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.save-btn:active{background:#4a3830;}
 
/* iOS 모달 */
.ios-modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.ios-modal.show{display:flex;}
.ios-modal img{max-width:100%;max-height:58vh;object-fit:contain;border-radius:8px;margin-bottom:14px;}
.ios-lbl{color:rgba(255,255,255,.8);font-size:13px;margin-bottom:10px;}
.ios-btns{display:flex;gap:8px;}
.ios-btn{padding:9px 18px;border:1px solid rgba(255,255,255,.35);border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;cursor:pointer;font-family:inherit;}
.ios-btn.save{background:#8b6f5c;border-color:#8b6f5c;}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="app-title">드로잉엣홈 카드뉴스</h1>
 
  <!-- 설정 -->
  <div class="settings">
    <h3>전체 설정</h3>
    <div class="cat-row">
      <button class="cat-btn on" id="cb_공간정보" onclick="setCat('공간정보')">PLACE</button>
      <button class="cat-btn" id="cb_스타일링팁" onclick="setCat('스타일링팁')">STYLING TIP</button>
      <button class="cat-btn" id="cb_시공사례" onclick="setCat('시공사례')">PORTFOLIO</button>
      <button class="cat-btn" id="cb_PICK" onclick="setCat('PICK')">PICK</button>
      <button class="cat-btn" id="cb_없음" onclick="setCat('')">없음</button>
    </div>
    <div class="sl-row"><label>표지 폰트</label>
      <input type="range" id="slGlob" min="20" max="52" value="37" oninput="slGlobV.textContent=this.value;redrawAll()">
      <span id="slGlobV">37</span></div>
    <div class="sl-row"><label>본문 폰트</label>
      <input type="range" id="slCont" min="18" max="52" value="24" oninput="slContV.textContent=this.value;redrawAll()">
      <span id="slContV">24</span></div>
    <div class="sl-row"><label>어둡기</label>
      <input type="range" id="slDim" min="0" max="60" value="0" oninput="slDimV.textContent=this.value;redrawAll()">
      <span id="slDimV">0</span></div>
  </div>
 
  <!-- 업로드 -->
  <label class="upload-btn">
    📷&nbsp; 사진 추가하기
    <input type="file" id="fileIn" accept="image/*" multiple style="display:none" onchange="onFiles(this.files);this.value=''">
  </label>
  <p class="upload-hint">끌어서 순서 변경 · 최대 20장</p>
 
  <!-- 그리드 -->
  <div class="grid" id="grid"></div>
</div>
 
<!-- 저장 바 -->
<div class="save-bar">
  <button class="save-btn" onclick="doSave()">💾 전체 저장</button>
</div>
 
<!-- iOS 모달 -->
<div class="ios-modal" id="iosModal">
  <p class="ios-lbl" id="iosLbl" style="font-weight:600"></p>
  <p style="color:rgba(255,255,255,.55);font-size:11px;margin-bottom:10px;">이미지를 꾹 눌러 → 사진에 저장 후 아래 버튼 누르세요</p>
  <img id="iosImg" src="" alt="" style="border-radius:8px;max-width:88%;max-height:55vh;object-fit:contain;margin-bottom:14px;">
  <div class="ios-btns">
    <button class="ios-btn save" id="iosNext" onclick="iosGoNext()">다음 →</button>
    <button class="ios-btn" onclick="iosClose()">닫기</button>
  </div>
</div>
 
<!-- offscreen -->
<canvas id="off" width="4320" height="5400" style="display:none"></canvas>
 
 
 
 
<script>
 
 
 
 
 
 
 
 
 
 
 
 
// ━━━━━━━━ 매거진 서브이미지 ━━━━━━━━
function setMagImg(i,slot,inp){
  const file=inp.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{cards[i][slot]=img;renderCard(i);};
    img.src=ev.target.result;
  };
  r.readAsDataURL(file);inp.value='';
}
 
 
 
 
 
 
 
 
 
// ━━━━━━━━ iOS 모달 ━━━━━━━━
function showIOS(i){
  if(i>=iosQ.length){iosClose();return;}
  const item=iosQ[i];
  const lbl=$('iosLbl');
  const img=$('iosImg');
  const nb=$('iosNext');
  if(lbl)lbl.textContent=(i+1)+'/'+iosQ.length+'  '+(item.name||'');
  if(img)img.src=item.data||'';
  if(nb)nb.textContent=i<iosQ.length-1?'다음 →':'완료';
  const modal=$('iosModal');
  if(modal)modal.classList.add('show');
  iosI=i;
}
function iosGoNext(){
  iosI++;
  if(iosI>=iosQ.length){iosClose();return;}
  showIOS(iosI);
}
function iosClose(){
  const modal=$('iosModal');
  if(modal)modal.classList.remove('show');
  iosQ=[];iosI=0;
}

// ━━━━━━━━ 로고 초기화 ━━━━━━━━
let logoOrigImg=null; // 원본(검정) 로고 img 보관
function initLogo(){
  const img=new Image();
  img.onload=()=>{
    logoOrigImg=img; // 원본 저장
    try{
      const c=document.createElement('canvas');
      c.width=img.naturalWidth||659; c.height=img.naturalHeight||100;
      const x=c.getContext('2d');
      if('filter' in x){x.filter='brightness(0) invert(1)';x.drawImage(img,0,0);x.filter='none';}
      else{
        x.drawImage(img,0,0);
        const d=x.getImageData(0,0,c.width,c.height);
        for(let i=0;i<d.data.length;i+=4){if(d.data[i+3]>10){d.data[i]=255-d.data[i];d.data[i+1]=255-d.data[i+1];d.data[i+2]=255-d.data[i+2];}}
        x.putImageData(d,0,0);
      }
      logoCanvas=c;
    }catch(e){logoCanvas=null;}
    redrawAll();
  };
  img.onerror=()=>{logoCanvas=null;};
  img.src=LOGO_DATA;
}
initLogo();
 
// ━━━━━━━━ canvas 공통 ━━━━━━━━
function drawLogo(t){
  if(!logoCanvas)return;
  const s=0.44, lw=logoCanvas.width*s, lh=logoCanvas.height*s;
  t.save(); t.globalAlpha=LA;
  t.drawImage(logoCanvas,(W-lw)/2,LOGO_Y,lw,lh);
  t.restore();
  // 브랜드 라인 제거 (요청)
}
 
// 마감카드용: 원본(검정) 로고 동기 그리기
function drawLogoDark(t){
  if(!logoOrigImg)return; // initLogo 완료 전이면 스킵
  const s=0.44, lw=logoOrigImg.width*s, lh=logoOrigImg.height*s;
  t.save(); t.globalAlpha=0.88;
  t.drawImage(logoOrigImg,(W-lw)/2,LOGO_Y,lw,lh);
  t.restore();
}
 
function ww(t,text,maxW,maxL){
  if(!text||!text.trim())return[];
  const out=[];
  for(const p of text.replace(/\r\n|\r|\n/g,'\n').split('\n')){
    if(!p.trim()){if(out.length)out.push('');continue;}
    let cur='';
    for(const ch of p){if(t.measureText(cur+ch).width>maxW&&cur){out.push(cur);cur=ch;}else cur+=ch;}
    if(cur)out.push(cur);
    if(out.length>=maxL)break;
  }
  return out.slice(0,maxL);
}
 
function drawBg(t,card,dim){
  if(card.img){
    const r=Math.max(W/card.img.width,H/card.img.height);
    t.drawImage(card.img,(W-card.img.width*r)/2,(H-card.img.height*r)/2,card.img.width*r,card.img.height*r);
  }else{
    const g=t.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#e8e0da');g.addColorStop(1,'#d4c8c0');
    t.fillStyle=g;t.fillRect(0,0,W,H);
  }
  if(dim>0){t.fillStyle=`rgba(0,0,0,${dim})`;t.fillRect(0,0,W,H);}
}
function topGrad(t){const g=t.createLinearGradient(0,0,0,H*.35);g.addColorStop(0,'rgba(0,0,0,.18)');g.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=g;t.fillRect(0,0,W,H);}
function btmGrad(t){const g=t.createLinearGradient(0,H*.42,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.6,'rgba(0,0,0,.10)');g.addColorStop(1,'rgba(0,0,0,.38)');t.fillStyle=g;t.fillRect(0,0,W,H);}
 
// 자간 설정 헬퍼 (tracking -40 = -0.04em)
function setTracking(t,fs){
  if('letterSpacing' in t) t.letterSpacing=(-40/1000*fs).toFixed(2)+'px';
}
function clearTracking(t){
  if('letterSpacing' in t) t.letterSpacing='0px';
}
 
function drawNC(t,num,cat,x,y){
  if(!cat)return;
  t.save();
  // 실제 번호
  t.font=`300 ${NFS*.65}px 'Pretendard',sans-serif`;
  t.fillStyle='rgba(255,255,255,.75)';
  t.fillText(num,x,y);
  const nw=t.measureText(num).width+12;
  // 구분자
  t.font=`300 ${CFS*.75}px 'Pretendard',sans-serif`;
  t.fillStyle='rgba(255,255,255,.25)';
  t.fillText('·',x+nw,y-2);
  const dw=t.measureText('·').width+12;
  // 카테고리
  t.font=`300 ${CFS*.78}px 'Pretendard',sans-serif`;
  t.fillStyle='rgba(255,255,255,.58)';
  t.fillText(cl(cat),x+nw+dw,y);
  t.restore();
}
 
// ━━━━━━━━ 카드 그리기 ━━━━━━━━
function drawCover(t,card){
  const fs=fs_glob();
  const cfs=Math.min(fs*1.1,89), sfs=Math.round(cfs*.44);
  topGrad(t);
  const bg=t.createLinearGradient(0,H*.38,0,H);
  bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(.55,'rgba(0,0,0,.12)');bg.addColorStop(1,'rgba(0,0,0,.42)');
  t.fillStyle=bg;t.fillRect(0,0,W,H);
  const hasSub=!!(card.subtitle&&card.subtitle.trim());
  t.save();t.font=`700 ${cfs}px 'Pretendard',sans-serif`;
  const tL=ww(t,card.title,W-PAD*2,3);
  let sL=[];
  if(hasSub){t.font=`400 ${sfs}px 'Pretendard',sans-serif`;sL=ww(t,card.subtitle,W-PAD*2,2);}
  t.restore();
  const tlh=cfs*1.312,slh=sfs*1.4;
  // baseline 기반 정확한 위치 계산
  // subY0 = 서브 첫줄 baseline = H*0.84 (마지막줄 기준)
  const subY0 = H*0.84;
  // 제목과 서브 사이 시각 간격 = TG
  // 제목 하단(baseline+descent) + TG = 서브 상단(baseline-ascent)
  // → tY(제목마지막줄) = subY0 - sfs*0.72 - TG - cfs*0.28
  // 서브있음: subY0(84%)에서 ascent/gap 고려해 제목 위치 결정
  // 서브없음: H*0.79 기준점에서 제목 블록 끝
  const tY = hasSub
    ? subY0 - sfs*0.72 - TG - cfs*0.28 - (tL.length-1)*tlh
    : H*0.79 - (tL.length-1)*tlh;
  t.save();t.shadowColor='rgba(0,0,0,.40)';t.shadowBlur=18;t.shadowOffsetY=2;
  t.font=`700 ${cfs}px 'Pretendard',sans-serif`;
  setTracking(t,cfs);
  t.fillStyle='rgba(255,253,250,.97)';t.textAlign='left';
  tL.forEach((l,i)=>t.fillText(l,PAD,tY+i*tlh));
  t.restore();
  if(hasSub){
    t.save();t.font=`400 ${sfs}px 'Pretendard',sans-serif`;
    setTracking(t,sfs);
    t.fillStyle='rgba(255,253,250,.75)';t.textAlign='left';
    sL.forEach((l,i)=>t.fillText(l,PAD,subY0+i*slh));
    t.restore();
  }
  drawLogo(t);
}
 
function drawBasic(t,card,idx){
  const tfs=Math.min(fs_glob()*1.1,89),tlh=tfs*1.312;
  topGrad(t);
  // 하단 그라데이션 강화 (Image1 참고)
  const bg2=t.createLinearGradient(0,H*.50,0,H);
  bg2.addColorStop(0,'rgba(0,0,0,0)');bg2.addColorStop(.7,'rgba(0,0,0,.22)');bg2.addColorStop(1,'rgba(0,0,0,.52)');
  t.fillStyle=bg2;t.fillRect(0,0,W,H);
  t.save();
  t.font=`700 ${tfs}px 'Pretendard',sans-serif`;
  const tL=ww(t,card.title,W-PAD*2,2);
  t.font=`300 ${DFS}px 'Pretendard',sans-serif`;
  const dL=(card.desc||'').trim()?ww(t,card.desc,W-PAD*2,3):[];
  t.restore();
  const hasD=dL.length>0;
  // 하단 고정 기준점: 설명 있으면 82%, 없으면 79%
  const blockBottom = hasD ? H*0.78 : H*0.75;
  const dH = hasD ? (dL.length*DLH+DG) : 0;
  const titleBlockH = (tL.length-1)*tlh;
  const tY = blockBottom - dH - titleBlockH;
  // 번호: 제목 첫줄 위 52px (tL이 없어도 안전)
  const ncY = tY - (tfs*0.72 + TG + NFS*0.65*0.28);
  if(card.cat) drawNC(t,String(idx).padStart(2,'0'),card.cat,PAD,ncY);
  t.save();
  t.shadowColor='rgba(0,0,0,.45)';t.shadowBlur=20;t.shadowOffsetY=3;
  t.font=`700 ${tfs}px 'Pretendard',sans-serif`;
  setTracking(t,tfs);
  t.fillStyle='rgba(255,253,250,.97)';t.textAlign='left';
  tL.forEach((l,i)=>t.fillText(l,PAD,tY+i*tlh));
  t.restore();
  if(hasD){
    t.save();
    t.font=`300 ${DFS}px 'Pretendard',sans-serif`;
    setTracking(t,DFS);
    t.fillStyle='rgba(255,253,250,.80)';t.textAlign='left';
    dL.forEach((l,i)=>t.fillText(l,PAD,tY+tL.length*tlh+DG+i*DLH));
    t.restore();
  }
  drawLogo(t);
}
 
 
function drawList(t,card,idx){
  const iFS=Math.min(fs_cont()*.72,46),nFS=Math.round(iFS*.72),iLH=iFS*1.45;
  topGrad(t);btmGrad(t);
  const items=(card.items||[]).filter(x=>x&&x.trim()).slice(0,4);
  const bH=items.length*iLH;
  // 번호 위치: 전체 블록 기준 79% 위로
  const bTop=Math.min(H*0.79-bH, H*0.60);
  if(card.cat) drawNC(t,String(idx).padStart(2,'0'),card.cat,PAD,bTop-(iFS*0.72+TG+NFS*0.65*0.28));
  let y=bTop+iFS*.85;
  items.forEach((item,li)=>{
    t.save();
    t.shadowColor='rgba(0,0,0,.25)';t.shadowBlur=8;
    t.font=`600 ${nFS}px 'Pretendard',sans-serif`;
    t.fillStyle='rgba(255,255,255,.42)';t.textAlign='left';
    t.fillText(`0${li+1}`,PAD,y);
    t.font=`400 ${iFS}px 'Pretendard',sans-serif`;
    setTracking(t,iFS);
    t.fillStyle='rgba(255,253,250,.90)';
    t.fillText(item,PAD+56,y);
    y+=iLH;t.restore();
  });
  drawLogo(t);
}
 
function drawMag(t,card,idx){
  // ── 매거진 1: 베이지 배경 + 번호→제목→설명→이미지 ──
  const bg=t.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#faf7f4');bg.addColorStop(1,'#f0ebe4');
  t.fillStyle=bg;t.fillRect(0,0,W,H);
  const C=op=>`rgba(32,26,20,${op})`;
 
  const tfs=Math.min(fs_glob()*0.88,76),tlh=tfs*1.312;
  const dfs=Math.min(fs_cont()*0.58,36),dlh=dfs*1.62;
 
  // 텍스트 측정
  t.save();
  t.font=`700 ${tfs}px 'Pretendard',sans-serif`;
  const tL=ww(t,card.title,W-PAD*2,3);
  t.font=`400 ${dfs}px 'Pretendard',sans-serif`;
  const dL=(card.desc||'').trim()?ww(t,card.desc,W-PAD*2,5):[];
  t.restore();
 
  // ── 번호/카테: 로고 아래 20px ──
  const logoBot=LOGO_Y+44;
  const ncY=logoBot+20+NFS*0.65;  // baseline
  if(card.cat) drawNC(t,String(idx).padStart(2,'0'),card.cat,PAD,ncY);
 
  // ── 제목: 번호 아래 TG 간격 ──
  const titleY=ncY+NFS*0.65*0.28+TG+tfs*0.72;
  if(tL.length>0){
    t.save();
    t.font=`700 ${tfs}px 'Pretendard',sans-serif`;
    setTracking(t,tfs);
    t.fillStyle=C(.88);t.textAlign='left';
    tL.forEach((l,i)=>t.fillText(l,PAD,titleY+i*tlh));
    t.restore();
  }
 
  // ── 설명: 제목 아래 24px ──
  const descY=titleY+Math.max(tL.length,1)*tlh+24;
  if(dL.length>0){
    t.save();
    t.font=`400 ${dfs}px 'Pretendard',sans-serif`;
    t.fillStyle=C(.55);t.textAlign='left';
    dL.forEach((l,i)=>t.fillText(l,PAD,descY+i*dlh));
    t.restore();
  }
 
  // ── 이미지: 설명 끝 아래 44px (최소 H*0.44) ──
  const imgTop=Math.max(descY+dL.length*dlh+44, H*0.44);
  const imgBot=H-PAD; const iPad=24;
 
  if(card.img&&imgBot-imgTop>80){
    t.save();t.beginPath();
    t.roundRect(PAD+iPad,imgTop,W-PAD*2-iPad*2,imgBot-imgTop,8);t.clip();
    const iW=W-PAD*2-iPad*2,iH=imgBot-imgTop;
    const r=Math.max(iW/card.img.width,iH/card.img.height);
    t.drawImage(card.img,PAD+iPad+(iW-card.img.width*r)/2,imgTop+(iH-card.img.height*r)/2,card.img.width*r,card.img.height*r);
    t.restore();
    t.save();t.strokeStyle=C(.10);t.lineWidth=1;
    t.beginPath();t.roundRect(PAD+iPad,imgTop,W-PAD*2-iPad*2,imgBot-imgTop,8);t.stroke();t.restore();
  }else if(imgBot-imgTop>80){
    t.save();t.strokeStyle=C(.12);t.lineWidth=1;t.fillStyle=C(.04);
    t.beginPath();t.roundRect(PAD+iPad,imgTop,W-PAD*2-iPad*2,imgBot-imgTop,8);t.fill();t.stroke();t.restore();
  }
  drawLogoDark(t);
}
 
function drawMag2(t,card,idx){
  // ── 매거진 2: 사진 배경 + 두 서브이미지 + 하단 인용구 ──
  topGrad(t);
  const btm=t.createLinearGradient(0,H*.55,0,H);
  btm.addColorStop(0,'rgba(0,0,0,0)');btm.addColorStop(.6,'rgba(0,0,0,.28)');btm.addColorStop(1,'rgba(0,0,0,.62)');
  t.fillStyle=btm;t.fillRect(0,0,W,H);
 
  const boxGap=20;
  const boxW=Math.round((W-PAD*2-boxGap)/2);
  const boxH=Math.round(boxW*1.22);
  const boxTop=Math.round(H*0.22);
  const boxL=PAD, boxR=PAD+boxW+boxGap;
 
  function drawBox(img,x,y,w,h,caption){
    t.save();
    t.beginPath();t.roundRect(x,y,w,h,6);t.clip();
    if(img){
      const r=Math.max(w/img.width,h/img.height);
      t.drawImage(img,x+(w-img.width*r)/2,y+(h-img.height*r)/2,img.width*r,img.height*r);
    }else{t.fillStyle='rgba(180,170,160,.55)';t.fillRect(x,y,w,h);}
    t.restore();
    t.save();t.strokeStyle='rgba(255,255,255,.20)';t.lineWidth=1;
    t.beginPath();t.roundRect(x,y,w,h,6);t.stroke();t.restore();
    if(caption&&caption.trim()){
      t.save();t.font=`400 22px 'Pretendard',sans-serif`;
      const tw=t.measureText(caption).width;
      t.fillStyle='rgba(255,255,255,.90)';
      t.beginPath();t.roundRect(x+12,y+12,tw+20,30,4);t.fill();
      t.fillStyle='rgba(28,22,16,.80)';
      t.fillText(caption,x+22,y+33);t.restore();
    }
  }
 
  drawBox(card.img2,boxL,boxTop,boxW,boxH,card.items&&card.items[0]);
  drawBox(card.img3,boxR,boxTop,boxW,boxH,card.items&&card.items[1]);
 
  const qfs=Math.min(fs_glob()*1.0,80),qlh=qfs*1.312;
  t.save();t.font=`700 ${qfs}px 'Pretendard',sans-serif`;
  const qL=(card.title||'').trim()?ww(t,card.title,W-PAD*2,2):[];
  t.restore();
 
  const boxBot=boxTop+boxH;
  const quoteY=boxBot+52+qfs*0.72;
  if(qL.length>0){
    t.save();t.shadowColor='rgba(0,0,0,.55)';t.shadowBlur=18;t.shadowOffsetY=2;
    t.font=`700 ${qfs}px 'Pretendard',sans-serif`;
    setTracking(t,qfs);
    t.fillStyle='rgba(255,253,250,.97)';t.textAlign='left';
    qL.forEach((l,i)=>t.fillText(l,PAD,quoteY+i*qlh));t.restore();
  }
  if(card.cat){
    const ncY=quoteY-(qfs*0.72+TG+NFS*0.65*0.28);
    if(ncY>boxBot+20) drawNC(t,String(idx).padStart(2,'0'),card.cat,PAD,ncY);
  }
  drawLogo(t);
}
 
function drawClosing(t){
  t.clearRect(0,0,W,H);
  // ── 배경 ──
  if(closingBg){
    const r=Math.max(W/closingBg.width,H/closingBg.height);
    t.drawImage(closingBg,(W-closingBg.width*r)/2,(H-closingBg.height*r)/2,closingBg.width*r,closingBg.height*r);
    t.fillStyle='rgba(255,255,255,.15)';t.fillRect(0,0,W,H);
  }else{
    const bg=t.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#faf7f3');bg.addColorStop(.6,'#f2ece4');bg.addColorStop(1,'#e8e0d6');
    t.fillStyle=bg;t.fillRect(0,0,W,H);
  }
  const C=op=>`rgba(28,24,20,${op})`;
 
  // ── 하단 정보 블록 ──
  const bY=H-PAD;           // 1250  EST.
  const handleY=bY-52;      // 1198  handle/url
  const subY=handleY-36;    // 1162  INSTAGRAM 라벨
 
  // EST. 2012
  t.save();
  t.font=`300 18px 'Pretendard',sans-serif`;
  t.fillStyle=C(.28);t.textAlign='left';
  t.fillText('EST.  2012',PAD,bY);
  t.restore();
 
  // handle (URL 또는 @계정)
  const handle=closingHandle||'@drawingathome_curtain';
  t.save();
  t.font=`300 32px 'Pretendard',sans-serif`;
  t.fillStyle=C(.72);t.textAlign='left';
  t.fillText(handle,PAD,handleY);
  t.restore();
 
  // INSTAGRAM 라벨 + 부가 메모
  const sub=closingNote&&closingNote.trim()?closingNote:'예약문의 디엠주세요.';
  t.save();
  t.font=`300 17px 'Pretendard',sans-serif`;
  t.fillStyle=C(.38);t.textAlign='left';
  t.fillText('INSTAGRAM  '+sub,PAD,subY);
  t.restore();
 
  // ── 메인 텍스트: 카드 45% 위치 (의도된 넓은 여백) ──
  const hFS=76, hLH=hFS*1.312;
  const dFS=34, dLH=dFS*1.62;
  // 제목 시각 top = H*0.43
  const titleTop=H*0.43;               // 580px
  const titleY=titleTop+hFS*0.72;      // baseline
 
  let tL=[];
  if(closingTitle&&closingTitle.trim()){
    t.save();t.font=`700 ${hFS}px 'Pretendard',sans-serif`;
    tL=ww(t,closingTitle,W-PAD*2,2);t.restore();
  }
  let dL=[];
  if(closingDesc&&closingDesc.trim()){
    t.save();t.font=`300 ${dFS}px 'Pretendard',sans-serif`;
    dL=ww(t,closingDesc,W-PAD*2,5);t.restore();
  }
 
  // 제목
  if(tL.length>0){
    t.save();
    t.font=`700 ${hFS}px 'Pretendard',sans-serif`;
    setTracking(t,hFS);
    t.fillStyle=C(.84);t.textAlign='left';
    tL.forEach((l,i)=>t.fillText(l,PAD,titleY+i*hLH));
    t.restore();
  }
 
  // 설명 (제목 끝 + 40px)
  const descStartY=titleY+Math.max(tL.length,1)*hLH+40;
  if(dL.length>0){
    t.save();
    t.font=`300 ${dFS}px 'Pretendard',sans-serif`;
    setTracking(t,dFS);
    t.fillStyle=C(.48);t.textAlign='left';
    dL.forEach((l,i)=>t.fillText(l,PAD,descStartY+i*dLH));
    t.restore();
  }
 
  drawLogoDark(t);
}
 
function renderCard(i){
  if(!cards[i])return;
  const cv=$('cv'+i);if(!cv)return;
  const t=cv.getContext('2d');if(!t)return;
  try{
    t.clearRect(0,0,W,H);
    drawBg(t,cards[i],fs_dim());
    if(i===0)drawCover(t,cards[i]);
    else if(cards[i].layout==='list')drawList(t,cards[i],i);
    else if(cards[i].layout==='magazine')drawMag(t,cards[i],i);
    else if(cards[i].layout==='magazine2')drawMag2(t,cards[i],i);
    else drawBasic(t,cards[i],i);
  }catch(e){console.warn('render:',e.message);}
}
 
function renderClosing(){
  const cv=$('cvclosing');if(!cv)return;
  const t=cv.getContext('2d');if(t)drawClosing(t);
}
 
 
function redrawAll(){
  cards.forEach((_,i)=>renderCard(i));
  renderClosing();
}

// ━━━━━━━━ 그리드 빌드 ━━━━━━━━
function buildGrid(){
  const grid=$('grid');
  if(!grid)return;
  grid.innerHTML='';
  if(!cards.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px 16px;color:#a89890;font-size:13px;">사진을 추가해 주세요</div>';
  }
  cards.forEach((card,i)=>{
    const div=document.createElement('div');
    div.className='card-item'+(i===0?' cover':'');
    div.dataset.i=i;
    div.innerHTML=buildCardHTML(card,i,i===0);
    setupDrag(div,i);
    grid.appendChild(div);
    renderCard(i);
  });
  // 마감 카드
  const clDiv=document.createElement('div');
  clDiv.className='card-item closing';
  clDiv.dataset.i='cl';
  clDiv.innerHTML=buildClosingHTML();
  grid.appendChild(clDiv);
  renderClosing();
}
 
function buildCardHTML(card,i,isCover){
  const badge=isCover?'<span class="badge cover-badge">표지</span>':'<span class="badge">'+i+'</span>';
  const preview=`<div class="preview"><canvas id="cv${i}" width="1080" height="1350"></canvas></div>`;
 
  let ctrl='';
  if(isCover){
    ctrl=`<div class="ctrl">
      <p class="cover-lbl">— 표지 카드 —</p>
      <textarea class="inp" rows="2" placeholder="메인 제목" oninput="cards[0].title=this.value;renderCard(0)">${esc(card.title)}</textarea>
      <p class="lbl">서브타이틀</p>
      <textarea class="inp" rows="2" placeholder="서브타이틀" oninput="cards[0].subtitle=this.value;renderCard(0)">${esc(card.subtitle||'')}</textarea>
      <div class="row">
        <label class="btn">📷 교체<input type="file" accept="image/*" style="display:none" onchange="replaceCard(0,this)"></label>
        <button class="btn" onclick="saveOne(0)">💾</button>
        <button class="btn btn-del" onclick="delCard(0)">✕ 삭제</button>
      </div>
    </div>`;
  }else{
    const tabs=['basic','list','magazine','magazine2'].map(l=>
      `<button class="tab${card.layout===l?' on':''}" onclick="setLayout(${i},'${l}')">${LLABEL[l]}</button>`).join('');
    let fields='';
    if(card.layout==='list'){
      fields=(card.items||['','']).map((v,li)=>
        `<input class="inp" style="margin-bottom:4px" placeholder="항목 ${li+1}" value="${esc(v)}" oninput="cards[${i}].items[${li}]=this.value;renderCard(${i})">`
      ).join('');
      fields=`<p class="lbl">리스트 항목</p>`+fields;
 
    }else if(card.layout==='magazine'){
      fields=`<p class="lbl">제목</p>
        <textarea class="inp" rows="2" placeholder="제목" oninput="cards[${i}].title=this.value;renderCard(${i})">${esc(card.title)}</textarea>
        <p class="lbl">본문</p>
        <textarea class="inp" rows="4" placeholder="본문 텍스트" oninput="cards[${i}].desc=this.value;renderCard(${i})">${esc(card.desc||'')}</textarea>`;
    }else if(card.layout==='magazine2'){
      fields=`<p class="lbl">왼쪽 이미지</p>
        <div class="row" style="margin-bottom:6px">
          <label class="btn">📷 업로드<input type="file" accept="image/*" style="display:none" onchange="setMagImg(${i},'img2',this)"></label>
          <input class="inp" style="flex:1;margin-left:4px" placeholder="@ 왼쪽 캡션" value="${esc((card.items&&card.items[0])||'')}" oninput="if(!cards[${i}].items)cards[${i}].items=['',''];cards[${i}].items[0]=this.value;renderCard(${i})">
        </div>
        <p class="lbl">오른쪽 이미지</p>
        <div class="row" style="margin-bottom:6px">
          <label class="btn">📷 업로드<input type="file" accept="image/*" style="display:none" onchange="setMagImg(${i},'img3',this)"></label>
          <input class="inp" style="flex:1;margin-left:4px" placeholder="@ 오른쪽 캡션" value="${esc((card.items&&card.items[1])||'')}" oninput="if(!cards[${i}].items)cards[${i}].items=['',''];cards[${i}].items[1]=this.value;renderCard(${i})">
        </div>
        <p class="lbl">하단 인용구</p>
        <textarea class="inp" rows="2" placeholder='"왜 다른 로만쉐이드는 이게 안 될까요."' oninput="cards[${i}].title=this.value;renderCard(${i})">${esc(card.title)}</textarea>`;
    }else{
      fields=`<p class="lbl">제목</p>
        <textarea class="inp" rows="2" placeholder="제목" oninput="cards[${i}].title=this.value;renderCard(${i})">${esc(card.title)}</textarea>
        <p class="lbl">설명</p>
        <textarea class="inp" rows="3" placeholder="설명 (선택)" oninput="cards[${i}].desc=this.value;renderCard(${i})">${esc(card.desc||'')}</textarea>`;
    }
    const catOpts=['공간정보','스타일링팁','시공사례','PICK',''].map(v=>
      `<option value="${v}" ${v===card.cat?'selected':''}>${cl(v)||'없음'}</option>`).join('');
    ctrl=`<div class="ctrl">
      <div class="tabs">${tabs}</div>
      ${fields}
      <div class="row">
        <label class="btn">📷 교체<input type="file" accept="image/*" style="display:none" onchange="replaceCard(${i},this)"></label>
        <button class="btn" onclick="saveOne(${i})">💾</button>
        <select class="cat-sel" onchange="cards[${i}].cat=this.value;renderCard(${i})">${catOpts}</select>
        <button class="btn btn-del" onclick="delCard(${i})">✕</button>
      </div>
    </div>`;
  }
  return badge+preview+ctrl;
}
 
function buildClosingHTML(){
  return `<span class="badge cover-badge" style="background:rgba(100,80,60,.5)">마감</span>
  <div class="preview"><canvas id="cvclosing" width="1080" height="1350"></canvas></div>
  <div class="ctrl">
    <p class="cover-lbl">— 마감 카드 —</p>
    <p class="lbl">제목 (크게)</p>
    <textarea class="inp" rows="2" placeholder="예: 커튼은 역시 드로잉엣홈" oninput="closingTitle=this.value;renderClosing()">${esc(closingTitle)}</textarea>
    <p class="lbl">설명</p>
    <textarea class="inp" rows="4" placeholder="예: 사진으로는 절반도 못 전해요.&#10;이 패브릭의 결, 빛 받는 방식, 내려오는 소리." oninput="closingDesc=this.value;renderClosing()">${esc(closingDesc)}</textarea>
    <p class="lbl">링크 / 계정</p>
    <input class="inp" placeholder="예: www.dahcurtain.co.kr" value="${esc(closingHandle)}" oninput="closingHandle=this.value;renderClosing()">
    <p class="lbl">INSTAGRAM 라벨 아래 문구</p>
    <input class="inp" placeholder="예: 예약문의 디엠주세요." value="${esc(closingNote)}" oninput="closingNote=this.value;renderClosing()">
    <div class="row" style="margin-top:6px">
      <label class="btn">📷 배경<input type="file" accept="image/*" style="display:none" onchange="setClBg(this)"></label>
      <button class="btn" onclick="saveOne('closing')">💾</button>
      <button class="btn btn-del" onclick="clearClBg()">× 제거</button>
    </div>
  </div>`;
}
 
// ━━━━━━━━ 동영상 정보 업데이트 ━━━━━━━━
 
// ━━━━━━━━ 파일 처리 ━━━━━━━━
function onFiles(files){
  if(!files||!files.length)return;
  const batch=Array.from(files).slice(0,20-cards.length);
  if(!batch.length)return;
  const isFirst=!cards.length;
  let pending=batch.length;
  const newC=new Array(batch.length).fill(null);
  function done(){
    pending--;
    if(pending>0)return;
    newC.forEach((c,idx)=>{
      if(!c)return;
      if(isFirst&&idx===0)cards.unshift(c);
      else cards.push(c);
    });
    buildGrid();
  }
  batch.forEach((file,fi)=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        newC[fi]={id:mkId(),img,
          layout:'basic',title:'',subtitle:'',desc:'',cat:globalCat,items:['','','']};
        done();
      };
      img.onerror=done;
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
  });
}
 
function delCard(i){
  cards.splice(i,1);buildGrid();
}
 
function replaceCard(i,inp){
  const file=inp.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{const img=new Image();img.onload=()=>{cards[i].img=img;buildGrid();};img.src=ev.target.result;};
  r.readAsDataURL(file);
  inp.value='';
}
 
function setLayout(i,l){cards[i].layout=l;buildGrid();}
 
function setClBg(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{const img=new Image();img.onload=()=>{closingBg=img;renderClosing();};img.src=ev.target.result;};
  r.readAsDataURL(f);inp.value='';
}
function clearClBg(){closingBg=null;renderClosing();}
 
function setCat(cat){
  globalCat=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('on'));
  // 없음(빈문자열)은 id='cb_없음'으로 처리
  const btnId=cat===''?'cb_없음':'cb_'+cat;
  const b=$(btnId);if(b)b.classList.add('on');
  cards.forEach((c,i)=>{c.cat=cat;renderCard(i);});
  document.querySelectorAll('.cat-sel').forEach(s=>{s.value=cat;});
}
 
// ━━━━━━━━ 드래그앤드롭 ━━━━━━━━
// 드래그 중 페이지 스크롤 방지 (document 레벨)
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>e.preventDefault());
 
function setupDrag(el,i){
  el.draggable=true;
  el.addEventListener('dragstart',e=>{
    dragSrc=i;
    el.classList.add('dragging');
    // 고스트 이미지를 미리보기 canvas로 제한 (배경 고정)
    const cv=el.querySelector('canvas');
    if(cv&&e.dataTransfer){
      e.dataTransfer.setDragImage(cv,cv.offsetWidth/2,cv.offsetHeight/2);
    }
    e.dataTransfer&&(e.dataTransfer.effectAllowed='move');
  });
  el.addEventListener('dragend',()=>{
    el.classList.remove('dragging');
    dragSrc=null;
    buildGrid();
  });
  el.addEventListener('dragover',e=>{
    e.preventDefault();
    e.dataTransfer&&(e.dataTransfer.dropEffect='move');
    el.classList.add('dragover');
  });
  el.addEventListener('dragleave',e=>{
    // 자식 요소로 이동 시 dragleave 오발 방지
    if(!el.contains(e.relatedTarget)) el.classList.remove('dragover');
  });
  el.addEventListener('drop',e=>{
    e.preventDefault();
    el.classList.remove('dragover');
    if(dragSrc!==null&&dragSrc!==i){
      const t=cards[dragSrc];cards[dragSrc]=cards[i];cards[i]=t;
    }
  });
}
 
// ━━━━━━━━ 저장 ━━━━━━━━
const offCV=$('off');
const offCX=offCV?offCV.getContext('2d'):null;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 
function renderOff(card,i){
  if(!offCX)return;
  // 2x 고화질: scale(2,2) 적용 (offCV=2160×2700, W/H=1080×1350 상수 유지)
  offCX.save();
  offCX.scale(4,4);
  offCX.clearRect(0,0,W,H);
  drawBg(offCX,card,fs_dim());
  if(i===0)drawCover(offCX,card);
  else if(card.layout==='list')drawList(offCX,card,i);
  else if(card.layout==='magazine')drawMag(offCX,card,i);
  else if(card.layout==='magazine2')drawMag2(offCX,card,i);
  else drawBasic(offCX,card,i);
  offCX.restore();
}
 
// 개별 카드 저장
async function saveOne(i){
  if(!offCX){alert('초기화 오류');return;}
  let data,name;
  if(i==='closing'){
    offCX.save();offCX.scale(4,4);
    drawClosing(offCX);drawLogoDark(offCX);
    offCX.restore();
    data=offCV.toDataURL('image/jpeg',0.92);
    name='DAH_마감.jpg';
    offCX.clearRect(0,0,offCV.width,offCV.height);
  }else{
    const card=cards[i];if(!card)return;
    renderOff(card,i);
    data=offCV.toDataURL('image/jpeg',0.92);
    name=`DAH_${String(i).padStart(2,'0')}_${i===0?'표지':LLABEL[card.layout]||'기본'}.jpg`;
    offCX.clearRect(0,0,offCV.width,offCV.height);
  }
  if(isIOS){iosQ=[{data,name:name.replace('.jpg','')}];iosI=0;showIOS(0);return;}
  const a=document.createElement('a');
  a.style.display='none';a.href=data;
  a.setAttribute('download',name);
  document.body.appendChild(a);a.click();
  setTimeout(()=>document.body.removeChild(a),600);
}
 
async function doSave(){
  if(!offCX){alert('초기화 오류');return;}
  if(!cards.length){alert('카드가 없습니다');return;}
  const btn=document.querySelector('.save-btn');
  if(btn){btn.disabled=true;btn.textContent='저장 중...';}
  try{
    const zip=new JSZip();
    for(let i=0;i<cards.length;i++){
      const card=cards[i];
      const numStr=String(i).padStart(2,'0');
      renderOff(card,i);
      const b64=offCV.toDataURL('image/jpeg',0.92).split(',')[1];
      zip.file(`DAH_${numStr}_${i===0?'표지':LLABEL[card.layout]||'기본'}.jpg`,b64,{base64:true});
      offCX.clearRect(0,0,offCV.width,offCV.height);
      if(btn)btn.textContent=`저장 중... ${i+1}/${cards.length+1}`;
      await new Promise(r=>setTimeout(r,30));
    }
    offCX.save();offCX.scale(4,4);drawClosing(offCX);drawLogoDark(offCX);offCX.restore();
    zip.file(`DAH_${String(cards.length).padStart(2,'0')}_마감.jpg`,offCV.toDataURL('image/jpeg',0.92).split(',')[1],{base64:true});
    offCX.clearRect(0,0,offCV.width,offCV.height);
    if(btn)btn.textContent='압축 중...';
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:1}});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.style.display='none';a.href=url;
    a.setAttribute('download','드로잉엣홈_카드뉴스.zip');
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},3000);
  }catch(e){
    alert('저장 오류: '+e.message);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='💾 전체 저장';}
  }
}
