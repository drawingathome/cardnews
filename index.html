<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드로잉엣홈 카드뉴스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
<style>
* { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard',sans-serif;background:#f5f3ef;color:#2d2420;min-height:100vh;}
/* ── 레이아웃 ── */
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
h1{font-size:18px;font-weight:600;color:#2d2420;margin-bottom:20px;text-align:center;}
/* ── 업로드 영역 ── */
.upload-zone{border:2px dashed #c8bdb7;border-radius:12px;padding:32px 20px;text-align:center;cursor:pointer;background:#fff;margin-bottom:20px;transition:border-color .2s;}
.upload-zone:hover{border-color:#8b6f5c;}
.upload-zone p{font-size:15px;color:#6b5a52;margin-bottom:6px;}
.upload-zone small{font-size:12px;color:#a89890;}
/* ── 카드 그리드 ── */
.hint{text-align:center;font-size:12px;color:#a89890;margin-bottom:14px;}
.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;}
/* ── 카드 아이템 ── */
.card-item{background:#fff;border:1px solid #e8e0da;border-radius:10px;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;container-type:inline-size;}
.card-item.cover-card{border-color:#8b6f5c;}
.card-item.closing-card{border-color:#c8bdb7;}
/* ── 미리보기 영역 ── */
.preview-wrap{position:relative;display:block;line-height:0;overflow:visible;}
.card-canvas{width:100%;aspect-ratio:1080/1350;display:block;background:#f0ebe6;}
/* ── 동영상 미리보기 ── */
.video-preview{width:100%;aspect-ratio:1080/1350;object-fit:cover;display:block;background:#1a1410;pointer-events:none;}
.vid-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;background:rgba(0,0,0,0.40);border:2px solid rgba(255,255,255,0.70);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;pointer-events:none;}
.vid-play-btn::after{content:'';display:block;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:15px solid rgba(255,255,255,0.90);margin-left:4px;}
.vid-play-btn::after{content:'';display:block;width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid rgba(255,255,255,0.9);margin-left:3px;}
.vid-top{position:absolute;top:14.7%;left:7.4%;color:rgba(255,255,255,0.62);pointer-events:none;display:flex;align-items:baseline;gap:0.9em;}
.vid-num{font-size:clamp(10px,7.1cqi,22px);font-weight:500;}
.vid-info{position:absolute;bottom:20%;left:7.4%;right:7.4%;color:#fff;pointer-events:none;}
.vid-cat{font-size:clamp(5px,4.1cqi,13px);letter-spacing:.22em;opacity:.75;font-weight:400;}
.vid-title{font-size:clamp(12px,5.9cqi,24px);font-weight:700;line-height:1.28;word-break:keep-all;letter-spacing:-.01em;display:block;}
.vid-desc{font-size:clamp(5px,3.1cqi,12px);opacity:.72;margin-top:.35em;line-height:1.35;font-weight:300;display:block;}
.vid-grad{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.22) 0%,transparent 40%,rgba(0,0,0,.15) 65%,rgba(0,0,0,.5) 100%);pointer-events:none;}
/* ── 로고 오버레이 ── */
.logo-ov{position:absolute;top:5.04%;left:50%;transform:translateX(-50%);width:27%;max-width:82%;filter:brightness(0) invert(1);pointer-events:none;z-index:10;opacity:.92;}
/* ── 카드 컨트롤 ── */
.card-controls{padding:12px;border-top:1px solid #f0ebe6;}
.ctrl-lbl{font-size:11px;color:#a89890;margin:8px 0 4px;font-weight:500;}
.cover-lbl{font-size:11px;color:#a89890;text-align:center;margin-bottom:8px;}
.card-input{width:100%;padding:8px 10px;border:1px solid #e8e0da;border-radius:6px;font-family:inherit;font-size:13px;color:#2d2420;background:#faf8f6;outline:none;resize:vertical;}
.card-input:focus{border-color:#8b6f5c;}
.card-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.btn{padding:7px 12px;border:1px solid #e8e0da;border-radius:6px;font-family:inherit;font-size:12px;background:#fff;color:#4a3830;cursor:pointer;}
.btn:hover{background:#f0ebe6;}
.btn-del{color:#c0392b;border-color:#e8d5d0;}
.btn-del:hover{background:#fdf5f4;}
.badge{position:absolute;top:8px;left:8px;padding:3px 7px;border-radius:4px;font-size:10px;font-weight:600;z-index:15;}
.badge-cover{background:rgba(80,50,35,.75);color:#fff;}
.badge-num{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(4px);}
.badge-vid{position:absolute;top:8px;right:8px;padding:3px 7px;border-radius:4px;font-size:10px;font-weight:600;background:rgba(80,50,180,.8);color:#fff;z-index:15;}
/* ── 레이아웃 탭 ── */
.layout-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
.ltab{padding:5px 8px;border:1px solid #e8e0da;border-radius:5px;font-size:11px;background:#fff;color:#6b5a52;cursor:pointer;}
.ltab.active{background:#8b6f5c;color:#fff;border-color:#8b6f5c;}
/* ── 카테고리 셀렉트 ── */
.cat-sel{padding:6px 8px;border:1px solid #e8e0da;border-radius:6px;font-family:inherit;font-size:12px;background:#fff;color:#4a3830;flex:1;}
/* ── 저장 버튼 ── */
.save-bar{background:#6b4c38;border-radius:10px;padding:14px 0;text-align:center;cursor:pointer;color:#fff;font-size:15px;font-weight:600;margin-bottom:12px;}
.save-bar:hover{background:#5a3d2d;}
.save-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.save-btn{background:#fff;border:1px solid #e8e0da;border-radius:8px;padding:12px 0;text-align:center;cursor:pointer;font-size:13px;color:#4a3830;}
.save-btn:hover{background:#f0ebe6;}
.footer{text-align:center;font-size:11px;color:#c0b0a8;padding-bottom:20px;}
 
/* ── 전역 설정 패널 ── */
.settings-panel{background:#fff;border:1px solid #e8e0da;border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.settings-panel h3{font-size:12px;color:#a89890;font-weight:500;margin-bottom:10px;letter-spacing:.05em;}
.settings-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.settings-row label{font-size:12px;color:#6b5a52;white-space:nowrap;min-width:60px;}
.cat-btn{padding:6px 10px;border:1px solid #e8e0da;border-radius:6px;font-size:12px;background:#fff;color:#4a3830;cursor:pointer;}
.cat-btn.active{background:#8b6f5c;color:#fff;border-color:#8b6f5c;}
.range-wrap{display:flex;align-items:center;gap:8px;flex:1;}
.range-wrap input[type=range]{flex:1;accent-color:#8b6f5c;}
.range-wrap span{font-size:12px;color:#6b5a52;min-width:28px;text-align:right;}
 
/* ── 로고 오버레이 ── */
.logo-ov{
  position:absolute;
  top:5.04%; /* LOGO_Y(68)/H(1350)=5.04% */
  left:50%;
  transform:translateX(-50%);
  width:27%;  /* canvas 기준 1080px에서 약 290px */
  max-width:82%;
  filter:brightness(0) invert(1);
  pointer-events:none;
  z-index:10;
  opacity:0.92;
}
/* ── 드래그 ── */
.card-item.dragging{opacity:.35;}
.card-item.drag-over{box-shadow:0 0 0 2px #8b6f5c;}
/* ── iOS 오버레이 ── */
.ios-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.ios-modal.show{display:flex;}
.ios-img{max-width:92vw;max-height:62vh;object-fit:contain;border-radius:6px;}
.ios-btns{margin-top:16px;display:flex;gap:12px;}
.ios-btn{padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:none;}
.ios-save{background:#8b6f5c;color:#fff;}
.ios-next{background:rgba(255,255,255,.15);color:#fff;}
.ios-close{background:rgba(255,255,255,.1);color:#fff;}
.ios-lbl{color:rgba(255,255,255,.6);font-size:12px;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏠 드로잉엣홈 카드뉴스</h1>
  <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <p>📷 사진 또는 동영상 업로드</p>
    <small>JPG · PNG · MP4 · MOV · 최대 20개 · 첫 파일이 표지</small>
    <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none" onchange="addFiles(this.files)">
  </div>
  <div class="settings-panel">
    <h3>⚙️ 전체 카드 설정</h3>
    <div class="settings-row">
      <label>카테고리</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="cat-btn active" id="cat_공간정보" onclick="setGlobalCat('공간정보')">PLACE</button>
        <button class="cat-btn" id="cat_스타일링팁" onclick="setGlobalCat('스타일링팁')">STYLING TIP</button>
        <button class="cat-btn" id="cat_시공사례" onclick="setGlobalCat('시공사례')">PORTFOLIO</button>
        <button class="cat-btn" id="cat_PICK" onclick="setGlobalCat('PICK')">PICK</button>
        <button class="cat-btn" id="cat_" onclick="setGlobalCat('')">없음</button>
      </div>
    </div>
    <div class="settings-row">
      <label>표지 폰트</label>
      <div class="range-wrap">
        <input type="range" id="globalFs" min="20" max="52" value="36" oninput="document.getElementById('gfsV').textContent=this.value;cards.forEach((_,i)=>renderPreview(i))">
        <span id="gfsV">36</span>
      </div>
    </div>
    <div class="settings-row">
      <label>본문 폰트</label>
      <div class="range-wrap">
        <input type="range" id="contentFs" min="18" max="52" value="30" oninput="document.getElementById('cfsV').textContent=this.value;cards.forEach((_,i)=>renderPreview(i))">
        <span id="cfsV">30</span>
      </div>
    </div>
    <div class="settings-row">
      <label>어둡기</label>
      <div class="range-wrap">
        <input type="range" id="dimVal" min="0" max="60" value="5" oninput="document.getElementById('dimV').textContent=this.value+'%';cards.forEach((_,i)=>renderPreview(i))">
        <span id="dimV">5%</span>
      </div>
    </div>
  </div>
  <p class="hint">≡ 카드를 꾹 누른 채 끌어서 순서를 바꿀 수 있어요</p>
  <div class="cards-grid" id="grid"></div>
  <div class="save-bar" onclick="saveAll()">💾 전체 저장</div>
  <div class="save-row">
    <div class="save-btn" onclick="saveCurrent()">현재 카드 저장</div>
    <div class="save-btn" onclick="document.getElementById('fileInput').click()">+ 파일 추가</div>
  </div>
  <p class="footer">1080×1350px · JPG · 인스타그램 최적화</p>
</div>
<!-- iOS 저장 모달 -->
<div class="ios-modal" id="iosModal">
  <img class="ios-img" id="iosImg" src="" alt="">
  <p class="ios-lbl" id="iosLbl"></p>
  <div class="ios-btns">
    <button class="ios-btn ios-save" onclick="iosSave()">📥 저장</button>
    <button class="ios-btn ios-next" id="iosNextBtn" onclick="iosNext()">다음 ▶</button>
    <button class="ios-btn ios-close" onclick="closeIOS()">✕ 닫기</button>
  </div>
</div>
<!-- offscreen canvas for saving -->
<canvas id="offscreen" width="1080" height="1350" style="display:none"></canvas>
<script>
// ══════════════════════════════════════════
// 상수
// ══════════════════════════════════════════
const W=1080,H=1350,PAD=80;
const LOGO_Y=68;
const LOGO_ALPHA=0.92;
const TITLE_COLOR='rgba(255,253,250,0.96)';
const CAT_EN={'공간정보':'PLACE','스타일링팁':'STYLING TIP','시공사례':'PORTFOLIO','PICK':'PICK','':''};
const LAYOUTS=['basic','intro','list','magazine'];
const LAYOUT_LABEL={basic:'기본형',intro:'인트로형',list:'리스트형',magazine:'매거진형'};
 
// ══════════════════════════════════════════
// 상태
// ══════════════════════════════════════════
let cards=[];
let closingTitle='';
let closingDesc='';
let closingSubNote='';
let closingBg=null;
let dragSrc=null;
 
// ══════════════════════════════════════════
// 로고
// ══════════════════════════════════════════
const logoEl=document.getElementById('logoEl')||Object.assign(new Image(),{id:'logoEl'});
let logoCanvas=null; // 흰색 변환된 offscreen canvas
 
function initLogo(){
  const img=new Image();
  img.onload=()=>{
    try{
      const off=document.createElement('canvas');
      off.width=img.naturalWidth||659;
      off.height=img.naturalHeight||100;
      const oc=off.getContext('2d');
      oc.filter='brightness(0) invert(1)';
      oc.drawImage(img,0,0);
      oc.filter='none';
      logoCanvas=off;
    }catch(e){logoCanvas=null;}
    cards.forEach((_,i)=>renderPreview(i));
    redrawClosing();
  };
  img.onerror=()=>{logoCanvas=null;};
  img.src='logo.png';
}
initLogo();
 
function drawLogo(t){
  if(!logoCanvas)return;
  const s=0.44;  // 659px 원본 → 292px (27%)
  const lw=logoCanvas.width*s,lh=logoCanvas.height*s;
  t.save();t.globalAlpha=LOGO_ALPHA;
  t.drawImage(logoCanvas,(W-lw)/2,LOGO_Y,lw,lh);
  t.restore();
}
 
// ══════════════════════════════════════════
// 유틸
// ══════════════════════════════════════════
let _id=0;
const mkId=()=>'c'+(++_id)+'_'+Date.now();
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const catLabel=c=>CAT_EN[c]||c;
 
function wrapText(t,text,maxW,maxLines=3){
  if(!text)return[];
  const lines=[];
  for(const para of text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n')){
    if(!para){lines.push('');continue;}
    const words=para.split('');
    let cur='';
    for(const ch of words){
      const test=cur+ch;
      if(t.measureText(test).width>maxW&&cur){lines.push(cur);cur=ch;}
      else cur=test;
    }
    if(cur)lines.push(cur);
    if(lines.length>=maxLines)break;
  }
  return lines.slice(0,maxLines);
}
 
 
// ── 전역 카테고리 ──
let globalCat='공간정보';
function setGlobalCat(cat){
  globalCat=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('cat_'+cat);
  if(btn)btn.classList.add('active');
  // 모든 카드 카테고리 업데이트
  cards.forEach((card,i)=>{
    card.category=cat;
    renderPreview(i);
    updateVidInfo(i);
  });
  // 카테고리 셀렉트도 업데이트
  document.querySelectorAll('.cat-sel').forEach(sel=>{sel.value=cat;});
  autoSave();
}
 
function autoSave(){
  try{
    const data={cards:cards.map(c=>({
      id:c.id,isVideo:c.isVideo||false,layout:c.layout,
      title:c.title,subtitle:c.subtitle,description:c.description,
      category:c.category,listItems:c.listItems
    })),closingTitle,closingDesc,closingSubNote};
    localStorage.setItem('dah_cards',JSON.stringify(data));
  }catch(e){}
}
 
// ══════════════════════════════════════════
// 파일 처리
// ══════════════════════════════════════════
function addFiles(files){
  if(!files||!files.length)return;
  const batch=Array.from(files).slice(0,20-cards.length);
  if(!batch.length)return;
  const isFirstBatch=!cards.length;
  let pending=0;
  // 처리 완료된 카드들 순서 보존을 위한 배열
  const newCards=new Array(batch.length).fill(null);
 
  function onAllDone(){
    pending--;
    if(pending>0)return;
    // 순서대로 삽입
    newCards.forEach((card,idx)=>{
      if(!card)return;
      if(isFirstBatch&&idx===0)cards.unshift(card);
      else cards.push(card);
    });
    rebuildGrid();
  }
 
  batch.forEach((file,fi)=>{
    pending++;
    const isVid=file.type.startsWith('video/')||/\.(mp4|mov|avi|webm|m4v|3gp|mkv)$/i.test(file.name);
    if(isVid){
      const videoUrl=URL.createObjectURL(file);
      newCards[fi]={id:mkId(),isVideo:true,videoUrl,img:null,
        layout:'basic',title:'',subtitle:'',description:'',
        category:globalCat||'공간정보',listItems:['','','']};
      onAllDone();
    } else {
      const reader=new FileReader();
      reader.onload=ev=>{
        const img=new Image();
        img.onload=()=>{
          newCards[fi]={id:mkId(),isVideo:false,videoUrl:null,img,
            layout:'basic',title:'',subtitle:'',description:'',
            category:globalCat||'공간정보',listItems:['','','']};
          onAllDone();
        };
        img.onerror=()=>onAllDone();
        img.src=ev.target.result;
      };
      reader.readAsDataURL(file);
    }
  });
}
 
// ══════════════════════════════════════════
// 그리드 렌더링
// ══════════════════════════════════════════
function rebuildGrid(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  if(!cards.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#a89890;font-size:14px;">사진이나 동영상을 업로드하면 카드가 생성됩니다</div>';
    addClosing(grid);
    return;
  }
  cards.forEach((card,i)=>{
    const item=document.createElement('div');
    item.className='card-item'+(i===0?' cover-card':'');
    item.dataset.index=i;
    item.innerHTML=buildCard(card,i,i===0);
    setupDrag(item,i);
    grid.appendChild(item);
    if(!card.isVideo)renderPreview(i);
    else initVideo(card.id);
  });
  addClosing(grid);
}
 
function rebuildOne(i){
  const item=document.querySelector(`[data-index="${i}"]`);
  if(!item||!cards[i])return;
  item.innerHTML=buildCard(cards[i],i,i===0);
  if(!cards[i].isVideo)renderPreview(i);
  else initVideo(cards[i].id);
  autoSave();
}
 
function buildCard(card,i,isCover){
  const badge=isCover
    ?'<span class="badge badge-cover">표지</span>'
    :`<span class="badge badge-num">${i}/${cards.length-1}</span>`;
  const vidBadge=card.isVideo?'<span class="badge-vid badge">🎬 VIDEO</span>':'';
  const logo='<img class="logo-ov" src="logo.png" alt="" aria-hidden="true">';
 
  // 미리보기 영역
  let preview='';
  if(card.isVideo){
    preview=`<div class="preview-wrap" onclick="tapPlay('${card.id}')" ontouchend="tapPlay('${card.id}');event.preventDefault()" style="cursor:pointer;">
      <video class="video-preview" id="vid_${card.id}"
        src="${card.videoUrl||''}" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
      <div class="vid-grad"></div>
      ${logo}
      <div class="vid-top">
        ${!isCover?`<span class="vid-num">${String(i).padStart(2,'0')}</span>`:''}
        <span class="vid-cat">${catLabel(card.category)}</span>
      </div>
      <div class="vid-info">
        <p class="vid-title" id="vtitle_${card.id}">${esc(card.title)}</p>
        <p class="vid-desc" id="vdesc_${card.id}">${esc(card.description||'')}</p>
      </div>
      <div class="vid-play-btn" id="playbtn_${card.id}" onclick="tapPlay('${card.id}')" ontouchend="tapPlay('${card.id}');event.stopPropagation()"></div>
    </div>`;
  } else {
    preview=`<div class="preview-wrap">
      <canvas class="card-canvas" id="cv_${i}" width="1080" height="1350"></canvas>
      ${logo}
    </div>`;
  }
 
  // 컨트롤
  let controls='';
  if(isCover){
    controls=`<div class="card-controls">
      <p class="cover-lbl">— 표지 카드 —</p>
      <textarea class="card-input" rows="2" placeholder="메인 제목" oninput="cards[0].title=this.value;renderPreview(0);updateVidInfo(0);autoSave()">${esc(card.title)}</textarea>
      <p class="ctrl-lbl">서브타이틀 (제목 아래)</p>
      <textarea class="card-input" rows="2" placeholder="서브타이틀" oninput="cards[0].subtitle=this.value;renderPreview(0);autoSave()">${esc(card.subtitle||'')}</textarea>
      <div class="card-row">

        <textarea class="card-input" rows="2" placeholder="임팩트 있는 제목" oninput="cards[${i}].title=this.value;renderPreview(${i});updateVidInfo(${i})">${esc(card.title)}</textarea>

    } else {
      content=`<p class="ctrl-lbl">제목</p>
        <textarea class="card-input" rows="2" placeholder="제목" oninput="cards[${i}].title=this.value;renderPreview(${i});updateVidInfo(${i})">${esc(card.title)}</textarea>
        <p class="ctrl-lbl">설명 텍스트</p>
        <textarea class="card-input" rows="3" placeholder="설명 (선택사항)" oninput="cards[${i}].description=this.value;renderPreview(${i});updateVidInfo(${i})">${esc(card.description||'')}</textarea>`;
    }
    controls=`<div class="card-controls">
      <div class="layout-tabs">${tabs}</div>
      ${content}
      <div class="card-row">
        <button class="btn" onclick="document.getElementById('rep_${i}').click()">📷 교체</button>
        <input type="file" id="rep_${i}" accept="image/*,video/*" style="display:none" onchange="replaceCard(${i},this)">
        <select class="cat-sel" onchange="cards[${i}].category=this.value;renderPreview(${i});updateVidInfo(${i})">
          ${['공간정보','스타일링팁','시공사례','PICK',''].map(v=>`<option value="${v}" ${v===card.category?'selected':''}>${CAT_EN[v]||'카테고리 없음'}</option>`).join('')}
        </select>

}

function initVideo(cardId){
  const vid=document.getElementById('vid_'+cardId);
  if(!vid)return;
  const btn=()=>document.getElementById('playbtn_'+cardId);
  const hideBtn=()=>{const b=btn();if(b)b.style.display='none';};
  const showBtn=()=>{const b=btn();if(b)b.style.display='flex';};
  const tryPlay=()=>vid.play().then(hideBtn).catch(showBtn);
  // canplay 이벤트 대기
  vid.addEventListener('canplay',tryPlay,{once:true});
  // src 설정 후 load
  if(vid.src&&vid.src!==location.href&&vid.src!=='about:blank'){
    // src 이미 있음 → 바로 load
    if(vid.readyState===0)vid.load();
    else tryPlay();
  }
  // 1000ms 후 재시도 (iOS Safari 지연 대응)
  setTimeout(tryPlay, 1000);
}
 
function tapPlay(cardId){
  const vid=document.getElementById('vid_'+cardId);
  if(!vid)return;
  const btn=document.getElementById('playbtn_'+cardId);
  if(vid.paused||vid.ended||vid.readyState<1){
    // src 확인
    const card=cards.find(c=>c.id===cardId);
    if(card&&card.videoUrl&&(!vid.src||vid.src===location.href||vid.networkState===3)){
      vid.src=card.videoUrl;
      vid.load();
    }
    vid.play().then(()=>{
      if(btn)btn.style.display='none';
    }).catch(()=>{
      if(btn)btn.style.display='flex';
    });
  } else {
    if(btn)btn.style.display='none';
  }
}
 
function updateVidInfo(i){
  if(!cards[i]||!cards[i].isVideo)return;
  const vid=document.getElementById('vid_'+cards[i].id);
  if(!vid)return;
  const wrap=vid.parentElement;
  if(!wrap)return;
  const ti=document.getElementById('vtitle_'+cards[i].id)||wrap.querySelector('.vid-title');
  const ca=wrap.querySelector('.vid-cat');
  const de=document.getElementById('vdesc_'+cards[i].id);
  if(ti)ti.textContent=cards[i].title||'';
  if(ca)ca.textContent=catLabel(cards[i].category)||'';
  if(de)de.textContent=cards[i].description||'';
  autoSave();
}

function deleteCard(i){
  if(!confirm('삭제할까요?'))return;
  if(cards[i]&&cards[i].videoUrl)URL.revokeObjectURL(cards[i].videoUrl);
  cards.splice(i,1);
  rebuildGrid();autoSave();
}
 
function replaceCard(i,input){
  const file=input.files[0];if(!file)return;
  const isVid=file.type.startsWith('video/')||/\.(mp4|mov|avi|webm|m4v|3gp|mkv)$/i.test(file.name);
  if(cards[i]&&cards[i].videoUrl)URL.revokeObjectURL(cards[i].videoUrl);
  if(isVid){
    const videoUrl=URL.createObjectURL(file);
    cards[i].isVideo=true;cards[i].videoUrl=videoUrl;cards[i].img=null;
    rebuildOne(i);
  } else {
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{cards[i].isVideo=false;cards[i].videoUrl=null;cards[i].img=img;rebuildOne(i);};
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }
  input.value='';
}
 
function setLayout(i,layout){
  if(!cards[i])return;
  cards[i].layout=layout;
  rebuildOne(i);
}

function setClosingBg(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{closingBg=img;redrawClosing();};
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  input.value='';
}
function clearClosingBg(){closingBg=null;redrawClosing();}

function setupDrag(item,i){
  if(i===0)return;
  item.draggable=true;
  item.addEventListener('dragstart',()=>{dragSrc=i;item.classList.add('dragging');});
  item.addEventListener('dragend',()=>{item.classList.remove('dragging');document.querySelectorAll('.card-item').forEach(el=>el.classList.remove('drag-over'));});
  item.addEventListener('dragover',e=>{e.preventDefault();if(dragSrc!==null&&dragSrc!==i&&i!==0){document.querySelectorAll('.card-item').forEach(el=>el.classList.remove('drag-over'));item.classList.add('drag-over');}});
  item.addEventListener('drop',e=>{e.preventDefault();if(dragSrc!==null&&dragSrc!==i&&i!==0){const t=cards[dragSrc];cards.splice(dragSrc,1);cards.splice(i>dragSrc?i-1:i,0,t);dragSrc=null;rebuildGrid();autoSave();}});
}

const NUM_FS=76,CAT_FS=44,DESC_FS=34;
const DESC_LH=DESC_FS*1.60;
const TITLE_GAP=32,DESC_GAP=32;
 
function renderPreview(i){
  if(!cards[i]||cards[i].isVideo)return;
  const cv=document.getElementById('cv_'+i);
  if(!cv)return;
  drawCard(cv.getContext('2d'),cards[i],i);
}
function redrawClosing(){
  const cv=document.getElementById('cv_closing');
  if(!cv)return;
  drawClosing(cv.getContext('2d'));
}
function drawBg(t,card,dim=0.05){
  if(card.img){
    const r=Math.max(W/card.img.width,H/card.img.height);
    const bw=card.img.width*r,bh=card.img.height*r;
    t.drawImage(card.img,(W-bw)/2,(H-bh)/2,bw,bh);
  }else{
    const g=t.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#e8e0da');g.addColorStop(1,'#d4c8c0');
    t.fillStyle=g;t.fillRect(0,0,W,H);
  }
  if(dim>0){t.fillStyle=`rgba(0,0,0,${dim})`;t.fillRect(0,0,W,H);}
}
function drawTopGrad(t){
  const g=t.createLinearGradient(0,0,0,H*0.30);
  g.addColorStop(0,'rgba(0,0,0,0.22)');g.addColorStop(1,'rgba(0,0,0,0)');
  t.fillStyle=g;t.fillRect(0,0,W,H);
}
function drawBtmGrad(t){
  const g=t.createLinearGradient(0,H*0.52,0,H);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.28)');
  t.fillStyle=g;t.fillRect(0,0,W,H);
}
function wrapWords(t,text,maxW,maxL=3){
  if(!text||!text.trim())return[];
  const lines=[];
  for(const para of text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n')){
    if(!para.trim()){if(lines.length)lines.push('');continue;}
    let cur='';
    for(const ch of para){
      if(t.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch;}
      else cur+=ch;
    }
    if(cur)lines.push(cur);
    if(lines.length>=maxL)break;
  }
  return lines.slice(0,maxL);
}
function drawNumCat(t,num,cat,x,y){
  if(!cat)return;
  t.save();
  t.font=`500 ${NUM_FS}px 'Pretendard',sans-serif`;
  t.fillStyle='rgba(255,255,255,0.60)';
  t.textAlign='left';t.letterSpacing='0px';
  const ns=num;
  t.fillText(ns,x,y);
  const nw=t.measureText(ns).width;
  t.font=`400 ${CAT_FS}px 'Pretendard',sans-serif`;
  t.fillStyle='rgba(255,255,255,0.50)';
  t.letterSpacing='1px';
  t.fillText(catLabel(cat),x+nw+18,y-10);
  t.restore();
}
function drawCover(t,card,fs){
  const cfs=Math.min(fs*1.1,88);
  const sfs=Math.round(cfs*0.44);
  const tlh=cfs*1.28,slh=sfs*1.4;
  drawTopGrad(t);
  const bg=t.createLinearGradient(0,H*0.50,0,H);
  bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(1,'rgba(0,0,0,0.30)');
  t.fillStyle=bg;t.fillRect(0,0,W,H);
  const hasSub=!!(card.subtitle&&card.subtitle.trim());
  t.save();t.font=`700 ${cfs}px 'Pretendard',sans-serif`;
  const tLines=wrapWords(t,card.title,W-PAD*2,3);
  let slCount=0;
  if(hasSub){t.font=`400 ${sfs}px 'Pretendard',sans-serif`;slCount=wrapWords(t,card.subtitle,W-PAD*2,2).length;}
  t.restore();
  const bb=H*0.82;
  const subH=hasSub?(slCount*slh+TITLE_GAP):0;
  const titleY=bb-subH-(tLines.length>1?(tLines.length-1)*tlh:0);
  t.save();
  t.shadowColor='rgba(0,0,0,0.38)';t.shadowBlur=18;t.shadowOffsetY=2;
  t.font=`700 ${cfs}px 'Pretendard',sans-serif`;
  t.fillStyle='rgba(255,253,250,0.97)';t.textAlign='left';t.letterSpacing='0px';
  tLines.forEach((l,i)=>t.fillText(l,PAD,titleY+i*tlh));
  t.restore();
  if(hasSub){
    t.save();t.font=`400 ${sfs}px 'Pretendard',sans-serif`;
    t.fillStyle='rgba(255,253,250,0.75)';t.textAlign='left';t.letterSpacing='0px';
    const sl=wrapWords(t,card.subtitle,W-PAD*2,2);
    const sy=bb-(sl.length-1)*slh;
    sl.forEach((l,i)=>t.fillText(l,PAD,sy+i*slh));
    t.restore();
  }
  drawLogo(t);
}
function drawBasic(t,card,fs,idx){
  const tfs=Math.min(fs*0.95,68);   // 기본형 제목 ≈63px
  const tlh=tfs*1.28;
  drawTopGrad(t);drawBtmGrad(t);
  drawNumCat(t,String(idx).padStart(2,'0'),card.category,PAD,LOGO_Y+131);
  t.save();
  t.font=`700 ${tfs}px 'Pretendard',sans-serif`;
  const tL=wrapWords(t,card.title,W-PAD*2,2);
  t.font=`300 ${DESC_FS}px 'Pretendard',sans-serif`;
  const dL=(card.description||'').trim()?wrapWords(t,card.description,W-PAD*2,3):[];
  t.restore();
  const hasD=dL.length>0;
  const bb=hasD?H*0.82:H*0.76;
  const dH=hasD?(dL.length*DESC_LH+DESC_GAP):0;
  const tY=bb-dH-(tL.length>1?(tL.length-1)*tlh:0);
  t.save();
  t.shadowColor='rgba(0,0,0,0.35)';t.shadowBlur=16;t.shadowOffsetY=2;
  t.font=`700 ${tfs}px 'Pretendard',sans-serif`;
  t.fillStyle='rgba(255,253,250,0.97)';t.textAlign='left';t.letterSpacing='0px';
  tL.forEach((l,i)=>t.fillText(l,PAD,tY+i*tlh));
  t.restore();
  if(hasD){
    t.save();t.font=`300 ${DESC_FS}px 'Pretendard',sans-serif`;
    t.fillStyle='rgba(255,253,250,0.70)';t.textAlign='left';t.letterSpacing='0px';
    dL.forEach((l,i)=>t.fillText(l,PAD,tY+tL.length*tlh+DESC_GAP+i*DESC_LH));
    t.restore();
  }
  drawLogo(t);
}
 
function drawIntro(t,card,fs,idx){
  const ifs=Math.min(fs*1.10,75);   // 인트로 제목 ≈73px
  const sfs=Math.min(fs*0.46,32);   // 서브 ≈30px
  const ilh=ifs*1.26,slh=sfs*1.58;
  drawTopGrad(t);
  const bg=t.createLinearGradient(0,H*0.42,0,H);
  bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(1,'rgba(0,0,0,0.50)');
  t.fillStyle=bg;t.fillRect(0,0,W,H);
  drawNumCat(t,String(idx).padStart(2,'0'),card.category,PAD,LOGO_Y+131);
  t.save();
  t.font=`700 ${ifs}px 'Pretendard',sans-serif`;t.letterSpacing='-1px';
  const tL=wrapWords(t,card.title,W-PAD*2,2);
  t.font=`300 ${sfs}px 'Pretendard',sans-serif`;t.letterSpacing='0px';
  const dL=(card.description||'').trim()?wrapWords(t,card.description,W-PAD*2,2):[];
  t.restore();
  const hasD=dL.length>0;
  const bb=hasD?H*0.76:H*0.68;
  const dH=hasD?(dL.length*slh+TITLE_GAP):0;
  const tY=bb-dH-(tL.length>1?(tL.length-1)*ilh:0);
  t.save();
  t.shadowColor='rgba(0,0,0,0.40)';t.shadowBlur=20;t.shadowOffsetY=3;
  t.font=`700 ${ifs}px 'Pretendard',sans-serif`;
  t.fillStyle='rgba(255,253,250,0.97)';t.textAlign='left';t.letterSpacing='-1px';
  tL.forEach((l,i)=>t.fillText(l,PAD,tY+i*ilh));
  t.restore();
  if(hasD){
    t.save();t.font=`300 ${sfs}px 'Pretendard',sans-serif`;
    t.fillStyle='rgba(255,253,250,0.68)';t.textAlign='left';t.letterSpacing='0px';
    dL.forEach((l,i)=>t.fillText(l,PAD,tY+tL.length*ilh+TITLE_GAP+i*slh));
    t.restore();
  }
  drawLogo(t);
}
 
function drawList(t,card,fs,idx){
  const iFS=Math.min(fs*0.55,40);   // 아이템 ≈36px
  const nFS=Math.round(iFS*0.72);
  const iLH=iFS*1.45;
  drawTopGrad(t);drawBtmGrad(t);
  drawNumCat(t,String(idx).padStart(2,'0'),card.category,PAD,LOGO_Y+131);
  const items=(card.listItems||[]).filter(x=>x&&x.trim()).slice(0,4);
  const blockH=items.length*iLH;
  const blockTop=Math.min(H-PAD*1.4-blockH,Math.round(H*0.57));
  let y=blockTop+iFS*0.85;
  items.forEach((item,li)=>{
    t.save();
    t.shadowColor='rgba(0,0,0,0.25)';t.shadowBlur=8;
    t.font=`600 ${nFS}px 'Pretendard',sans-serif`;
    t.fillStyle='rgba(255,255,255,0.42)';t.textAlign='left';t.letterSpacing='0px';
    t.fillText(`0${li+1}`,PAD,y);
    t.font=`400 ${iFS}px 'Pretendard',sans-serif`;
    t.fillStyle='rgba(255,253,250,0.90)';
    t.fillText(item,PAD+56,y);
    y+=iLH;t.restore();
  });
  drawLogo(t);
}
 
function drawMagazine(t,card,fs,idx){
  const bfs=Math.min(fs*0.64,46);   // 본문 ≈42px
  const blh=bfs*1.52;
  drawTopGrad(t);drawBtmGrad(t);
  drawNumCat(t,String(idx).padStart(2,'0'),card.category,PAD,LOGO_Y+131);
  t.save();t.font=`300 ${bfs}px 'Pretendard',sans-serif`;
  const dL=(card.description||'').trim()?wrapWords(t,card.description,W-PAD*2,5):[];
  t.restore();
  const blockH=dL.length*blh;
  const blockTop=Math.min(H-PAD*1.6-blockH,Math.round(H*0.60));
  if(dL.length>0){
    t.save();
    t.shadowColor='rgba(0,0,0,0.25)';t.shadowBlur=8;
    t.font=`300 ${bfs}px 'Pretendard',sans-serif`;
    t.fillStyle='rgba(255,253,250,0.90)';t.textAlign='left';t.letterSpacing='0px';
    dL.forEach((l,i)=>t.fillText(l,PAD,blockTop+bfs*0.85+i*blh));
    t.restore();
  }
  drawLogo(t);
}

// ── 메인 카드 그리기 ──
function drawCard(t, card, i){
  if(!card){t.clearRect(0,0,W,H);return;}
  const fsEl=document.getElementById('globalFs');
  const cfEl=document.getElementById('contentFs');
  const dimEl=document.getElementById('dimVal');
  const coverFs=(fsEl?parseInt(fsEl.value)||36:36)*2.2;
  const contentFs=(cfEl?parseInt(cfEl.value)||28:28)*2.2;
  const dim=(dimEl?parseInt(dimEl.value)||5:5)/100;
  t.clearRect(0,0,W,H);
  drawBg(t,card,dim);
  if(i===0) drawCover(t,card,coverFs);
  else if(card.layout==='intro')  drawIntro(t,card,contentFs,i);
  else if(card.layout==='list')   drawList(t,card,contentFs,i);
  else if(card.layout==='magazine') drawMagazine(t,card,contentFs,i);
  else drawBasic(t,card,contentFs,i);
}
 
 
function drawClosing(t){
  t.clearRect(0,0,W,H);
  // 배경
  if(closingBg){
    const r=Math.max(W/closingBg.width,H/closingBg.height);
    const bw=closingBg.width*r,bh=closingBg.height*r;
    t.drawImage(closingBg,(W-bw)/2,(H-bh)/2,bw,bh);
    t.fillStyle='rgba(0,0,0,0.20)';t.fillRect(0,0,W,H);
  } else {
    const bg=t.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#ffffff');
    bg.addColorStop(0.5,'#faf7f2');
    bg.addColorStop(1,'#f3ede3');
    t.fillStyle=bg;t.fillRect(0,0,W,H);
  }
 
  const D=(op)=>`rgba(42,28,18,${op})`;
  const D82=D(0.82),D76=D(0.76),D72=D(0.72),D52=D(0.52),D18=D(0.18);
 
  // ── 하단 고정 요소 (아래→위, 지침 수치) ──
  // EST.2012: Y=H-PAD=1270
  const estY   = H-PAD;         // 1270
  // @handle: EST 위 (12+간격)
  const handleY= estY-12-22;    // 1236
  // INSTAGRAM 레이블: handle 위 (32+간격)
  const instaY = handleY-32-22; // 1182
  // 주소: INSTAGRAM 위 (14+간격)
  const addrY  = instaY-14-24;  // 1144
 
  t.save();t.font=`300 12px 'Pretendard',sans-serif`;
  t.fillStyle=D18;t.textAlign='left';t.letterSpacing='5px';
  t.fillText('EST. 2012',PAD,estY);t.restore();
 
  t.save();t.font=`500 32px 'Pretendard',sans-serif`;
  t.fillStyle=D76;t.textAlign='left';t.letterSpacing='0px';
  t.fillText('@drawingathome_curtain',PAD,handleY);t.restore();
 
  t.save();t.font=`300 14px 'Pretendard',sans-serif`;
  t.fillStyle=D52;t.textAlign='left';t.letterSpacing='5px';
  t.fillText('INSTAGRAM',PAD,instaY);t.restore();
 
  const addr=(closingSubNote&&closingSubNote.trim())?closingSubNote:'서울 서초구 반포동 725-21 1층';
  t.save();t.font=`300 20px 'Pretendard',sans-serif`;
  t.fillStyle=D72;t.textAlign='left';t.letterSpacing='0px';
  t.fillText(addr,PAD,addrY);t.restore();
 
  // ── 제목 + 설명 (지침: y시작=453, 상단453=하단452 균형) ──
  const hlFS=78;      // 지침 헤드라인 78px
  const hlLH=hlFS*1.28;
  const descFS=34;
  const descLH=descFS*1.60;
 
  let titleLines=[];
  if(closingTitle&&closingTitle.trim()){
    t.save();t.font=`700 ${hlFS}px 'Pretendard',sans-serif`;
    titleLines=wrapWords(t,closingTitle,W-PAD*2,3);
    t.restore();
  }
  let descLines=[];
  if(closingDesc&&closingDesc.trim()){
    t.save();t.font=`300 ${descFS}px 'Pretendard',sans-serif`;
    descLines=wrapWords(t,closingDesc,W-PAD*2,4);
    t.restore();
  }
 
  // 지침: y시작=453 고정
  const titleStartY=453;
 
  if(titleLines.length>0){
    t.save();t.font=`700 ${hlFS}px 'Pretendard',sans-serif`;
    t.fillStyle=D82;t.textAlign='left';t.letterSpacing='-2px';
    titleLines.forEach((l,i)=>t.fillText(l,PAD,titleStartY+i*hlLH));
    t.restore();
  }
  if(descLines.length>0){
    const descStartY=titleStartY+titleLines.length*hlLH+28;
    t.save();t.font=`300 ${descFS}px 'Pretendard',sans-serif`;
    t.fillStyle=D72;t.textAlign='left';t.letterSpacing='0px';
    descLines.forEach((l,i)=>t.fillText(l,PAD,descStartY+i*descLH));
    t.restore();
  }
 
  drawLogo(t);
}
 
function drawCardToOffscreen(card,i){
  if(card.isVideo){
    const vid=document.getElementById('vid_'+card.id);
    if(vid&&vid.videoWidth&&vid.readyState>=2){
      offCtx.clearRect(0,0,W,H);
      const r=Math.max(W/vid.videoWidth,H/vid.videoHeight);
      const bw=vid.videoWidth*r,bh=vid.videoHeight*r;
      offCtx.drawImage(vid,(W-bw)/2,(H-bh)/2,bw,bh);
      // 그라데이션 overlay
      const g=offCtx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'rgba(0,0,0,0.22)');g.addColorStop(0.4,'rgba(0,0,0,0)');
      g.addColorStop(0.7,'rgba(0,0,0,0.15)');g.addColorStop(1,'rgba(0,0,0,0.5)');
      offCtx.fillStyle=g;offCtx.fillRect(0,0,W,H);
      if(card.title){
        const cfs=62*2.2*0.9;
        offCtx.save();offCtx.font=`700 ${Math.min(cfs,88)}px 'Pretendard',sans-serif`;
        offCtx.fillStyle='rgba(255,253,250,0.95)';offCtx.textAlign='left';
        offCtx.fillText(card.title,PAD,H-PAD*2.5);offCtx.restore();
      }
    } else {
      offCtx.fillStyle='#1a1410';offCtx.fillRect(0,0,W,H);
    }
    drawLogo(offCtx);
  } else {
    drawCard(offCtx,card,i);
  }
}
 
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function saveAll(){
  if(!cards.length){alert('카드가 없습니다.');return;}
  const all=[];
  cards.forEach((card,i)=>{
    drawCardToOffscreen(card,i);
    all.push({data:offCanvas.toDataURL('image/jpeg',0.92),name:`DAH_${String(i).padStart(2,'0')}_${i===0?'표지':LAYOUT_LABEL[card.layout]||'기본'}`});
  });
  drawClosing(offCtx);drawLogo(offCtx);
  all.push({data:offCanvas.toDataURL('image/jpeg',0.92),name:`DAH_${String(cards.length).padStart(2,'0')}_마감`});
 
  if(isIOS){
    _iosQueue=all;_iosIdx=0;showIOSCard(0);return;
  }
  for(const {data,name} of all){
    await new Promise(res=>{
      offCanvas.toBlob(blob=>{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download=name+'.jpg';
        document.body.appendChild(a);a.click();
        document.body.removeChild(a);
        setTimeout(()=>{URL.revokeObjectURL(url);res();},300);
      },'image/jpeg',0.92);
    });
  }
}
 
function saveCurrent(){
  const active=document.querySelector('.card-item.cover-card,[data-index]');
  // 현재는 전체 저장과 동일하게 처리
  saveAll();
}
 
// iOS 저장
function showIOSCard(idx){
  if(idx>=_iosQueue.length){closeIOS();return;}
  const {data,name}=_iosQueue[idx];
  document.getElementById('iosImg').src=data;
  document.getElementById('iosLbl').textContent=name;
  document.getElementById('iosNextBtn').style.display=idx<_iosQueue.length-1?'':'none';
  document.getElementById('iosModal').classList.add('show');
  _iosIdx=idx;
}

  // Safari: 이미지 꾹 누르기로 저장
  alert('이미지를 꾹 누른 후 → 사진에 저장');
}
function iosNext(){showIOSCard(_iosIdx+1);}
function closeIOS(){document.getElementById('iosModal').classList.remove('show');}
